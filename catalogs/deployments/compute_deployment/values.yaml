# Chart defaults for catalogs/deployments/compute_deployment. The values a chart cannot be
# installed without (name, deploymentId, imageUrl, domain, containerPort, exposedPort,
# storageClassName, resources and one SSH credential) have no default; see component.go
# for the whole schema.

# Pod scheduler. kai-scheduler bin-packs GPUs; set to "" for the cluster default.
schedulerName: kai-scheduler
# Size of the /dev/shm tmpfs, as a Kubernetes quantity.
devShmSize: 512Mi
# Ship container logs to the cluster's log pipeline.
enableLogging: true
# The compute-ssh launcher image, built from compute-ssh/ in this chart. Its tag is the
# root VERSION file: a release PR changes both, and component_test.go fails when they
# differ.
sshInjectorImage: ghcr.io/nvidia/ccluster-compute-ssh:0.0.8
