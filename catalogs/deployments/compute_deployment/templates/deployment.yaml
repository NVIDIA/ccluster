apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    platform.centml.ai/deployment-id: "{{ .Values.deploymentId }}"
  labels:
    platform.centml.ai/deployment-id: "{{ .Values.deploymentId }}"
    platform.centml.ai/workload_type: compute
  name: "{{ .Values.name }}"
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
        platform.centml.ai/deployment-id: "{{ .Values.deploymentId }}"
        platform.centml.ai/workload_type: compute
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
        platform.centml.ai/deployment-id: "{{ .Values.deploymentId }}"
        {{- if not .Values.enableLogging }}
        platform.centml.ai/log-exclude: "true"
        {{- end }}
        {{- if .Values.userAnnotations }}
        {{- range $key, $value := .Values.userAnnotations }}
        ccluster.nvidia.com/user-{{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- end }}
      labels:
        platform.centml.ai/deployment-id: "{{ .Values.deploymentId }}"
        platform.centml.ai/workload_type: compute
        {{- if .Values.userAnnotations }}
        {{- range $key, $value := .Values.userAnnotations }}
        ccluster.nvidia.com/user-{{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- end }}
    spec:
      {{- if .Values.schedulerName }}
      schedulerName: {{ .Values.schedulerName }}
      {{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                {{- range $key, $value := .Values.nodeAffinityLabels }}
                - key: "{{ $key }}"
                  operator: In
                  values:
                    - {{ $value }}
                {{- end }}
      initContainers:
        - name: ssh-launcher-init
          image: "{{ .Values.sshInjectorImage }}"
          command:
            - /compute-ssh
            - install
            - /ssh-bin/compute-ssh
          volumeMounts:
            - mountPath: /ssh-bin
              name: ssh-launcher
      containers:
        - env:
          - name: "CCLUSTER_SSH_ADDR"
            value: ":{{ .Values.containerPort }}"
          - name: "CCLUSTER_SSH_HOST_KEY_DIR"
            value: "/home/.ccluster/ssh"
          - name: "CCLUSTER_SSH_WORKDIR"
            value: "/home"
          {{- range $key, $value := .Values.envVars }}
          - name: "{{ $key }}"
            value: "{{ $value }}"
          {{- end }}

          # if the customer has provided a private key, we need to mount it into the container
          # and point to it from this env var
          {{- if .Values.sshPublicKey }}
          - name: "SSH_PUBLIC_KEY_FILE"
            value: "/authorized_keys"
          {{- end }}
    
          # if the customer has provided a github username, we need to set it as an env var
          {{- if .Values.sshGithubUsername }}
          - name: "SSH_GITHUB_USERNAME"
            value: "{{ .Values.sshGithubUsername }}"
          {{- end }}

          # if  the customer has provided a username we need to set it as an env var
          {{- if .Values.sshUsername }}
          - name: "SSH_USERNAME"
            value: "{{ .Values.sshUsername }}"
          {{- end }}

          # if the customer has provided a password we need to load the secret into an env var
          {{- if .Values.sshPassword }}
          - name: "SSH_PASSWORD"
            valueFrom:
              secretKeyRef:
                key: ssh_password
                name: ssh-password-{{ .Values.deploymentId }}
          {{- end }}

          image: "{{ .Values.imageUrl }}"
          command:
            - /ccluster/compute-ssh/compute-ssh
          name: user-container
          ports:
            - containerPort: {{ .Values.containerPort }}
              protocol: TCP
          resources:
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}
              {{- with .Values.resources.limits }}
              {{- if .acceleratorCount }}
              {{ .acceleratorKey | default "nvidia.com/gpu" }}: {{ .acceleratorCount | int }}
              {{- end }}
              {{- end }}
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
              {{- with .Values.resources.requests }}
              {{- if .acceleratorCount }}
              {{ .acceleratorKey | default "nvidia.com/gpu" }}: {{ .acceleratorCount | int }}
              {{- end }}
              {{- end }}
          volumeMounts:
            - mountPath: /ccluster/compute-ssh
              name: ssh-launcher
              readOnly: true
            - mountPath: /home
              name: compute-volume
            - mountPath: /dev/shm
              name: dshm
          {{- if .Values.sshPublicKey }}
            # note we can't overlay mounts unfortunately
            - mountPath: /authorized_keys
              subPath: authorized_keys
              name: authorized-keys
          {{- end }}
      imagePullSecrets:
        - name: ecr-image-pull
        {{- if .Values.imagePullSecret }}
        - name: {{ .Values.name }}-image-pull-secret
        {{- end }}

      securityContext:
        fsGroup: 1001
        # Need to add extra group ids if we are using an AMD gpu as the group id is not consistent
        # More details on why this is need is found here: https://github.com/CentML/platform/issues/1917
        {{- if .Values.supplementalGroupIds }}
        supplementalGroups:
          {{- range .Values.supplementalGroupIds }}
          - {{ . }}
          {{- end }}
        {{- end }}
      tolerations:
        - effect: NoSchedule
          key: dedicated_compute
          operator: Equal
          value: "true"
      volumes:
        - name: ssh-launcher
          emptyDir: {}
        - name: compute-volume
          persistentVolumeClaim:
            claimName: "{{ .Values.name }}"
        - emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.devShmSize }}
          name: dshm
      {{- if .Values.sshPublicKey }}
        - name: authorized-keys
          configMap:
            name: authorized-keys-{{ .Values.deploymentId }}
      {{- end }}
