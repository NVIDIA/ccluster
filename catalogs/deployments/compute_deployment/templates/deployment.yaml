{{- /* The home claim is the chart's own unless homePvcName supplies one; every other
       claim in volumeMounts gets one pod volume however many times it is mounted. */}}
{{- $homeClaimName := default .Values.name .Values.homePvcName }}
{{- $volumeNameByClaim := dict $homeClaimName "compute-volume" }}
{{- range $index, $mount := .Values.volumeMounts }}
{{- if not (hasKey $volumeNameByClaim $mount.name) }}
{{- $_ := set $volumeNameByClaim $mount.name (printf "external-volume-%d" $index) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    platform.centml.ai/deployment-id: "{{ .Values.deploymentId }}"
  labels:
    platform.centml.ai/deployment-id: "{{ .Values.deploymentId }}"
    platform.centml.ai/workload_type: compute
  name: "{{ .Values.name }}"
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  # The home volume and any volumeMounts are ReadWriteOnce; a RollingUpdate would try to
  # schedule the new pod before the old one releases the claim and get stuck attaching.
  strategy:
    type: Recreate
  selector:
    matchLabels:
        platform.centml.ai/deployment-id: "{{ .Values.deploymentId }}"
        platform.centml.ai/workload_type: compute
  template:
    {{- $annotations := dict
          "sidecar.istio.io/inject" "false"
          "platform.centml.ai/deployment-id" (toString .Values.deploymentId) }}
    {{- $labels := dict
          "platform.centml.ai/deployment-id" (toString .Values.deploymentId)
          "platform.centml.ai/workload_type" "compute"
          "ccluster.nvidia.com/component-type" "user-container" }}
    {{- with .Values.revisionNumber }}
    {{- $_ := set $annotations "platform.centml.ai/revision-number" (. | int64 | toString) }}
    {{- $_ := set $labels "platform.centml.ai/revision-number" (. | int64 | toString) }}
    {{- end }}
    {{- if not .Values.enableLogging }}
    {{- $_ := set $annotations "platform.centml.ai/log-exclude" "true" }}
    {{- end }}
    {{- with .Values.kaiQueue }}
    {{- $_ := set $labels "kai.scheduler/queue" (toString .) }}
    {{- end }}
    {{- range $key, $value := .Values.userAnnotations }}
    {{- $_ := set $annotations (printf "ccluster.nvidia.com/user-%s" $key) (toString $value) }}
    {{- $_ := set $labels (printf "ccluster.nvidia.com/user-%s" $key) (toString $value) }}
    {{- end }}
    metadata:
      annotations:
        {{- include "podMetadata" (dict "chart" $annotations "caller" .Values.podAnnotations) | nindent 8 }}
      labels:
        {{- include "podMetadata" (dict "chart" $labels "caller" .Values.podLabels) | nindent 8 }}
    spec:
      {{- if .Values.schedulerName }}
      schedulerName: {{ .Values.schedulerName }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- end }}
      {{- if .Values.nodeAffinityLabels }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                {{- range $key, $value := .Values.nodeAffinityLabels }}
                - key: {{ $key | quote }}
                  operator: In
                  values:
                    - {{ $value | quote }}
                {{- end }}
      {{- end }}
      initContainers:
        - name: ssh-launcher-init
          image: "{{ .Values.sshInjectorImage }}"
          command:
            - /compute-ssh
            - install
            - /ssh-bin/compute-ssh
          volumeMounts:
            - mountPath: /ssh-bin
              name: ssh-launcher
      containers:
        - env:
          - name: "CCLUSTER_SSH_ADDR"
            value: ":{{ .Values.containerPort }}"
          - name: "CCLUSTER_SSH_HOST_KEY_DIR"
            value: "/home/.ccluster/ssh{{ if .Values.homePvcName }}/{{ .Values.deploymentId }}{{ end }}"
          - name: "CCLUSTER_SSH_WORKDIR"
            value: "/home"
          {{- range $key, $value := .Values.envVars }}
          - name: {{ $key | quote }}
            value: {{ $value | quote }}
          {{- end }}
          {{- range $key, $ref := .Values.secretEnvVars }}
          - name: {{ $key | quote }}
            valueFrom:
              secretKeyRef:
                name: {{ $ref.secretName | quote }}
                key: {{ $ref.key | quote }}
          {{- end }}

          # if the customer has provided a private key, we need to mount it into the container
          # and point to it from this env var
          {{- if .Values.sshPublicKey }}
          - name: "SSH_PUBLIC_KEY_FILE"
            value: "/authorized_keys"
          {{- end }}

          image: "{{ .Values.imageUrl }}"
          command:
            - /ccluster/compute-ssh/compute-ssh
          name: user-container
          # A compute deployment is an interactive box; keep its SSH identity
          # consistent instead of inheriting an arbitrary image's USER.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          ports:
            - containerPort: {{ .Values.containerPort }}
              protocol: TCP
          resources:
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}
              {{- with .Values.resources.limits }}
              {{- if .acceleratorCount }}
              {{ .acceleratorKey | default "nvidia.com/gpu" }}: {{ .acceleratorCount | int }}
              {{- end }}
              {{- end }}
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
              {{- with .Values.resources.requests }}
              {{- if .acceleratorCount }}
              {{ .acceleratorKey | default "nvidia.com/gpu" }}: {{ .acceleratorCount | int }}
              {{- end }}
              {{- end }}
          volumeMounts:
            - mountPath: /ccluster/compute-ssh
              name: ssh-launcher
              readOnly: true
            - mountPath: /home
              name: compute-volume
            - mountPath: /dev/shm
              name: dshm
          {{- range $mount := .Values.volumeMounts }}
            - mountPath: {{ $mount.mountPath | quote }}
              name: {{ get $volumeNameByClaim $mount.name }}
              readOnly: {{ $mount.readOnly | default false }}
          {{- end }}
          {{- if .Values.sshPublicKey }}
            # note we can't overlay mounts unfortunately
            - mountPath: /authorized_keys
              subPath: authorized_keys
              name: authorized-keys
          {{- end }}
      imagePullSecrets:
        {{- include "imagePullSecrets" .Values | trim | nindent 8 }}

      securityContext:
        fsGroup: 1001
      tolerations:
        - effect: NoSchedule
          key: dedicated_compute
          operator: Equal
          value: "true"
      volumes:
        - name: ssh-launcher
          emptyDir: {}
        - name: compute-volume
          persistentVolumeClaim:
            claimName: {{ $homeClaimName | quote }}
        - emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.devShmSize }}
          name: dshm
      {{- $renderedClaims := dict $homeClaimName true }}
      {{- range $mount := .Values.volumeMounts }}
      {{- if not (hasKey $renderedClaims $mount.name) }}
      {{- $_ := set $renderedClaims $mount.name true }}
        - name: {{ get $volumeNameByClaim $mount.name }}
          persistentVolumeClaim:
            claimName: {{ $mount.name | quote }}
      {{- end }}
      {{- end }}
      {{- if .Values.sshPublicKey }}
        - name: authorized-keys
          configMap:
            name: authorized-keys-{{ .Values.deploymentId }}
      {{- end }}
