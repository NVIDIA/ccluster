{{- if .Values.sshPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: ssh-password-{{ .Values.deploymentId }}
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  ssh_password: {{ .Values.sshPassword | b64enc | quote }}
{{- end }}
