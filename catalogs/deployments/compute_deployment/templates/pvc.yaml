apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    platform.centml.ai/deployment-id: "{{ .Values.deploymentId }}"
  name: "{{ .Values.name }}"
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage:
        "{{ max 100 (mul (.Values.resources.requests.acceleratorCount | int) 100) }}Gi"
  storageClassName: "{{ .Values.storageClassName }}"
