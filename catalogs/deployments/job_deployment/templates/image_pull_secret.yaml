{{- with .Values.imagePullSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Values.name }}-image-pull-secret
  namespace: {{ $.Release.Namespace }}
  labels:
    platform.centml.ai/deployment-id: {{ $.Values.deploymentId | quote }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict .server (dict "username" .username "password" .password "auth" (printf "%s:%s" .username .password | b64enc))) | toJson | b64enc }}
{{- end }}
