{{- $_ := required "model is required" .Values.model }}
{{- /* Values.Validate checks kvTransfer too, but callers that skip it reach the template
       directly. */}}
{{- if hasKey .Values "kvTransfer" }}
{{- $kv := .Values.kvTransfer }}
{{- if ne (.Values.servingMode | default "aggregated") "disaggregated" }}
{{- fail "kvTransfer is only for disaggregated serving" }}
{{- end }}
{{- if not (has $kv.backend (list "UCX" "LIBFABRIC")) }}
{{- fail "kvTransfer.backend must be UCX or LIBFABRIC" }}
{{- end }}
{{- if ne (eq $kv.backend "LIBFABRIC") (hasKey $kv "efa") }}
{{- fail "kvTransfer.efa is required with LIBFABRIC and not allowed with UCX" }}
{{- end }}
{{- with $kv.efa }}
{{- if or (ne (.deviceClassName | default "efa.networking.k8s.aws") "efa.networking.k8s.aws") (ne (.devicesPerWorker | default 1 | int) 1) }}
{{- fail "kvTransfer.efa supports only deviceClassName efa.networking.k8s.aws and devicesPerWorker 1" }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: {{ .Values.name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    platform.centml.ai/deployment-id: "{{ .Values.deploymentId }}"
  annotations:
    platform.centml.ai/revision-number: "{{ .Values.revisionNumber | int64 }}"
spec:
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        {{- /* dynamo.setPodMetadata opts the Frontend out of the user namespace's Istio
               sidecar injection. The streaming response path (Worker → Frontend) is raw
               TCP on an OS-assigned ephemeral port (see requestPlane in values.yaml),
               which cannot be pre-declared for auto-mTLS. */}}
        {{- $annotations := dict }}
        {{- $labels := dict "ccluster.nvidia.com/component-type" "frontend" }}
        {{- include "dynamo.setPodMetadata" (dict "Values" .Values "annotations" $annotations "labels" $labels) }}
        metadata:
          annotations:
            {{- include "dynamo.podMetadata" (dict "chart" $annotations "caller" .Values.podAnnotations) | nindent 12 }}
          labels:
            {{- include "dynamo.podMetadata" (dict "chart" $labels "caller" .Values.podLabels) | nindent 12 }}
        spec:
          {{- include "dynamo.kaiPodScheduling" .Values | nindent 10 }}
          containers:
            - name: main
              image: {{ .Values.imageUrl | quote }}
              # Dynamo uses the same --http-port setting for its HTTP and
              # KServe gRPC inference listeners. Pass it explicitly so a user
              # env var cannot silently move the process away from the port
              # declared below.
              command: ["python3"]
              args:
                - "-m"
                - "dynamo.frontend"
                - "--http-port"
                - {{ .Values.containerPort | int | quote }}
                {{- if eq (.Values.backendProtocol | default "HTTP") "GRPC" }}
                - "--kserve-grpc-server"
                # Keep the dedicated API field authoritative over env_vars and
                # reserve Dynamo's default HTTP metrics/health listener. The
                # value is the chart's kserveGrpcMetricsPort, which the Go package's
                # Validate keeps containerPort away from.
                - "--grpc-metrics-port"
                - {{ .Values.kserveGrpcMetricsPort | int | quote }}
                {{- else }}
                - "--no-kserve-grpc-server"
                {{- end }}
              # The operator Service exposes a fixed port 8000 and forwards to
              # this named target port, so the container port may differ.
              # The name `http` is a contract, not a label: the operator's
              # Service targets `intstr.FromString("http")` (operator const
              # DynamoContainerPortName, deploy/operator/internal/consts) —
              # renaming it breaks Service → pod forwarding.
              ports:
                - name: http
                  containerPort: {{ .Values.containerPort | int }}
                  protocol: TCP
              env:
                # Frontend router mode. Default to kv (the aggregated +
                # KV-router pattern); a caller-supplied envVars or secretEnvVars entry wins.
                # Emit exactly once so glibc's getenv (first match in environ[])
                # cannot be shadowed by a duplicate user env entry.
                - name: DYN_ROUTER_MODE
                  {{- with get (.Values.secretEnvVars | default dict) "DYN_ROUTER_MODE" }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ .secretName | quote }}
                      key: {{ .key | quote }}
                  {{- else }}
                  # `| default dict` so an omitted/empty env_vars doesn't crash `index` on nil.
                  value: {{ index (.Values.envVars | default dict) "DYN_ROUTER_MODE" | default "kv" | quote }}
                  {{- end }}
                {{- include "dynamo.runtimeEnv" . | nindent 16 }}
                # Preserve the 1.2.1 router defaults explicitly for the 1.4 upgrade.
                - name: DYN_ROUTER_QUEUE_THRESHOLD
                  value: "4.0"
                - name: DYN_DISABLE_FRONTEND_ADMIN_API
                  value: "1"
                - name: DYN_DISABLE_FRONTEND_NVEXT
                  value: "1"
                - name: DYN_VLLM_ENABLE_INFERENCE_V1_GENERATE
                  value: "0"
                {{- include "dynamo.userEnv" (dict "root" . "component" "frontend") | nindent 16 }}
              {{- if .Values.hfToken }}
              # The Frontend also fetches model/tokenizer metadata from Hugging Face during
              # endpoint registration, so it needs the token too (gated models 401 otherwise).
              # Consumed as an HF_TOKEN env var from the chart-owned Secret (secret.hf.yaml).
              envFrom:
                - secretRef:
                    name: {{ .Values.name }}-hf-token
              {{- end }}
              {{- if eq (.Values.backendProtocol | default "HTTP") "GRPC" }}
              # KServe gRPC does not expose the default HTTP health endpoints,
              # so use TCP socket checks when its server is enabled.
              livenessProbe:
                tcpSocket:
                  port: http
              readinessProbe:
                successThreshold: 1
                tcpSocket:
                  port: http
              {{- end }}
              # The Frontend is CPU-only; request a small slice so it can be
              # scheduled even when no spare GPU capacity exists.
              resources:
                limits:
                  cpu: "1"
                  memory: "1Gi"
                requests:
                  cpu: "500m"
                  memory: "512Mi"
              {{- if .Values.volumeMounts }}
              # The Frontend reads local model metadata at the same paths as the workers.
              volumeMounts:
                {{- include "dynamo.volumeMounts" .Values | trim | nindent 16 }}
              {{- end }}
          {{- if .Values.volumeMounts }}
          volumes:
            {{- include "dynamo.pvcVolumes" .Values | trim | nindent 12 }}
          {{- end }}
          {{- with include "dynamo.imagePullSecrets" .Values | trim }}
          imagePullSecrets:
            {{- . | nindent 12 }}
          {{- end }}
          # The Frontend is CPU-only, so it carries no GPU-type nodeAffinity
          # (that is only for the workers). It keeps the dedicated_compute
          # toleration so it can still schedule on an all-GPU-node cluster.
          tolerations:
            - effect: NoSchedule
              key: dedicated_compute
              operator: Equal
              value: "true"

    {{- if eq (.Values.servingMode | default "aggregated") "disaggregated" }}
    {{- include "dynamo.disaggregatedWorker" (dict "root" . "pool" .Values.decodePool "role" "decode" "name" "VllmDecodeWorker") | nindent 4 }}
    {{- include "dynamo.disaggregatedWorker" (dict "root" . "pool" .Values.prefillPool "role" "prefill" "name" "VllmPrefillWorker") | nindent 4 }}
    {{- else }}
    {{- include "dynamo.aggregatedWorker" . | nindent 4 }}
    {{- end }}
