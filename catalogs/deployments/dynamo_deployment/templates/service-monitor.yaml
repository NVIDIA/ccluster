{{/* Frontend metrics share the HTTP listener, or use the separate GRPC health/metrics
listener. Workers expose metrics on the operator's system port. Numeric target ports
also cover listeners that are not declared as container ports. */}}
{{- $metricsPort := .Values.containerPort | int -}}
{{- if eq (.Values.backendProtocol | default "HTTP") "GRPC" -}}
{{- $metricsPort = .Values.kserveGrpcMetricsPort | int -}}
{{- end -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-frontend-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    platform.centml.ai/deployment-id: "{{ .Values.deploymentId }}"
    app.kubernetes.io/name: {{ .Values.name }}-frontend-metrics
spec:
  selector:
    platform.centml.ai/deployment-id: "{{ .Values.deploymentId }}"
    ccluster.nvidia.com/component-type: frontend
  ports:
    - name: metrics
      port: {{ $metricsPort }}
      targetPort: {{ $metricsPort }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.name }}-frontend-metrics
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      platform.centml.ai/deployment-id: "{{ .Values.deploymentId }}"
      app.kubernetes.io/name: {{ .Values.name }}-frontend-metrics
  endpoints:
    - port: metrics
      path: {{ index (.Values.envVars | default dict) "DYN_HTTP_SVC_METRICS_PATH" | default "/metrics" | quote }}
      interval: 15s
      relabelings:
        {{- include "dynamo.metricsLabels" . | nindent 8 }}
      metricRelabelings:
        - targetLabel: deployment_id
          replacement: "{{ .Values.deploymentId }}"
          action: replace
{{- $root := . -}}
{{- $roles := list "worker" -}}
{{- if eq (.Values.servingMode | default "aggregated") "disaggregated" -}}
{{- $roles = list "prefill" "decode" -}}
{{- end -}}
{{- range $role := $roles }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Values.name }}-{{ $role }}-metrics
  namespace: {{ $root.Release.Namespace }}
  labels:
    platform.centml.ai/deployment-id: "{{ $root.Values.deploymentId }}"
    app.kubernetes.io/name: {{ $root.Values.name }}-{{ $role }}-metrics
spec:
  selector:
    platform.centml.ai/deployment-id: "{{ $root.Values.deploymentId }}"
    ccluster.nvidia.com/component-type: {{ $role }}
  ports:
    - name: metrics
      port: {{ include "dynamo.workerMetricsPort" $root }}
      targetPort: {{ include "dynamo.workerMetricsPort" $root }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $root.Values.name }}-{{ $role }}-metrics
  namespace: {{ $root.Release.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $root.Values.name }}-{{ $role }}-metrics
      platform.centml.ai/deployment-id: "{{ $root.Values.deploymentId }}"
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      relabelings:
        {{- include "dynamo.metricsLabels" $root | nindent 8 }}
{{- end }}
