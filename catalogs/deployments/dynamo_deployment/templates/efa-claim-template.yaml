{{- /* One exclusive EFA NIC per disaggregated worker, allocated by DRA through the DRANet
       driver. Named per revision; dgd.yaml validates kvTransfer.efa. */ -}}
{{- if hasKey (.Values.kvTransfer | default dict) "efa" }}
{{- $efa := .Values.kvTransfer.efa | default dict }}
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: {{ include "dynamo.efaClaimTemplateName" . | quote }}
  namespace: {{ .Release.Namespace }}
spec:
  spec:
    devices:
      requests:
        - name: efa
          exactly:
            deviceClassName: {{ $efa.deviceClassName | default "efa.networking.k8s.aws" | quote }}
            allocationMode: ExactCount
            count: {{ $efa.devicesPerWorker | default 1 | int }}
            selectors:
              - cel:
                  expression: 'device.driver == "dra.net" && device.attributes["dra.net"].pciDevice == "Elastic Fabric Adapter (EFA)" && device.attributes["dra.net"].rdma'
{{- end }}
