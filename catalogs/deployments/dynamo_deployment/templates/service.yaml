{{- /*
The HTTPRoute's backend: the Frontend pods, selected by the labels this chart puts on
them. The Dynamo operator's own `<name>-frontend` Service names its port `http`, which
Istio reads as HTTP/1.1, so the Gateway could not speak gRPC to it. This Service declares
the protocol in appProtocol instead, in the form the Gateway implementation reads (see
catalogs/deployments/edge). The Frontend has no sidecar, so the
Gateway connects to it in plaintext.
*/ -}}
apiVersion: v1
kind: Service
metadata:
    labels:
        platform.centml.ai/deployment-id: "{{ .Values.deploymentId }}"
    name: {{ .Values.name | quote }}
    namespace: {{ .Release.Namespace }}
spec:
    type: ClusterIP
    selector:
        platform.centml.ai/deployment-id: "{{ .Values.deploymentId }}"
        ccluster.nvidia.com/component-type: frontend
    ports:
        - name: http
          port: {{ .Values.containerPort | int }}
          targetPort: http
          appProtocol: {{ include "edge.appProtocol" . }}
