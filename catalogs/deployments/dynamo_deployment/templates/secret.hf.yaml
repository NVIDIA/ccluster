{{- if .Values.hfToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-hf-token
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  HF_TOKEN: "{{ .Values.hfToken | b64enc }}"
{{- end }}
