# The base namespace `namespace-default` NetworkPolicy denies egress to all
# private (RFC1918) networks except a small allowlist (DNS, istiod, ingress).
# Dynamo workloads need three extra cross-namespace destinations:
#
# 1. The operator-managed NATS broker in `dynamo-system` (port 4222) for the
#    request plane / KV-event publisher.
# 2. The Kubernetes API server (port 443) because the operator runs Dynamo
#    with `DYN_DISCOVERY_BACKEND=kubernetes`, so each pod's dynamo runtime
#    talks to the API to register `DynamoWorkerMetadata` CRs and to watch
#    `EndpointSlice` reflectors. The `kubernetes` service in `default` is
#    backed by node-IP endpoints (not pods), so the only safe selector is
#    ipBlock on the cluster service CIDR. Using 0.0.0.0/0 + port 443 here
#    is intentionally broad: requests to the API server are authenticated /
#    authorized via the pod's ServiceAccount token regardless.
#
# Targeted via the operator-applied label
# `nvidia.com/dynamo-graph-deployment-name=<dgd name>` so this policy only
# affects the Frontend and every aggregated or Prefill/Decode worker pod of
# *this* deployment.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}-dynamo-egress
  namespace: {{ .Release.Namespace }}
  labels:
    platform.centml.ai/deployment-id: "{{ .Values.deploymentId }}"
spec:
  podSelector:
    matchLabels:
      nvidia.com/dynamo-graph-deployment-name: {{ .Values.name | quote }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dynamo-system
      ports:
        - port: 4222
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
