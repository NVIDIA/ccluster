{{/*
  Always render this resource (do not wrap the whole file in `{{- if .session_affinity }}`).
  ArgoCD syncs with prune=False (api/src/services/argocd.py:399), so a chart that
  conditionally renders the DR would leave a stale DR behind on a true->false toggle.
  By keeping the resource always present and toggling only the trafficPolicy, kubectl
  apply's 3-way merge cleanly removes the loadBalancer field on next sync. An empty
  DR (host only, no trafficPolicy) is a routing no-op — verified on Nebius (Istio
  1.24.6, prod parity) that Envoy CDS is byte-equivalent to no DR.
*/}}
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: {{ .Values.name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    platform.centml.ai/deployment-id: "{{ .Values.deploymentId }}"
spec:
  # Must point to ClusterIP Service, not ExternalName.
  # Istio 1.21+: DestinationRule cannot apply to ExternalName services.
  host: {{ .Values.name }}.{{ .Release.Namespace }}.svc.cluster.local
  {{- if .Values.sessionAffinity }}
  trafficPolicy:
    loadBalancer:
      # Pin locality LB to off so the consistent-hash invariant stays
      # self-contained: if the mesh-level default is ever flipped on,
      # NGINX sidecars in different zones would build different endpoint
      # rings and the same X-Session-Id could route to different pods.
      localityLbSetting:
        enabled: false
      # Field is `consistentHash` (not `consistentHashLB` — the type name);
      # wrong name is silently dropped. Header must use hyphens: NGINX's
      # default `underscores_in_headers off` drops X_Session_Id silently.
      consistentHash:
        httpHeaderName: "X-Session-Id"
  # outlierDetection deliberately omitted: it silently enables Istio
  # locality-aware routing (istio/istio#41674, #48084), which breaks
  # consistent hash across multi-zone NGINX replicas. Pod health is
  # handled by the rollout's readinessProbe + endpoints controller.
  {{- end }}
