# The HTTPRoute's backend. appProtocol declares the container's protocol in the form the
# Gateway implementation reads; see catalogs/deployments/edge.
apiVersion: v1
kind: Service
metadata:
    labels:
        platform.centml.ai/deployment-id: "{{ .Values.deploymentId }}"
    name: "{{ .Values.name }}"
    namespace: {{ .Release.Namespace }}
spec:
    type: ClusterIP
    selector:
        platform.centml.ai/deployment-id: "{{ .Values.deploymentId }}"
    ports:
        - name: container-port
          port: {{ .Values.containerPort }}
          targetPort: {{ .Values.containerPort }}
          appProtocol: {{ include "edge.appProtocol" . }}
