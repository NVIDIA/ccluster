{{- if .Values.endpointCertificateAuthority }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-ca-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  ca.crt: "{{ .Values.endpointCertificateAuthority | b64enc }}"
{{- end }}

