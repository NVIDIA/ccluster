{{- /* One pod volume per distinct claim, however many times it is mounted. */}}
{{- $volumeNameByClaim := dict }}
{{- range $index, $mount := .Values.volumeMounts }}
{{- if not (hasKey $volumeNameByClaim $mount.name) }}
{{- $_ := set $volumeNameByClaim $mount.name (printf "external-volume-%d" $index) }}
{{- end }}
{{- end }}
# Load the (potentially) extra config files from _helpers.tpl.
{{- template "setExtraConfigFiles" . }}

apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Values.name | quote }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if .Values.userAnnotations }}
    {{- range $key, $value := .Values.userAnnotations }}
    ccluster.nvidia.com/user-{{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- end }}
  {{- if .Values.userAnnotations }}
  labels:
    {{- range $key, $value := .Values.userAnnotations }}
    ccluster.nvidia.com/user-{{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  # Revision history isn't very useful for us. The configuration can change
  # so we always roll forward, even if we're "rolling back".
  revisionHistoryLimit: 1
  # Set progress deadline to 1 hr to give enough buffer time for allow pods to be scheduled
  progressDeadlineSeconds: 3600

  # Label selector for pods. Existing ReplicaSets whose pods are selected by
  # this will be the ones affected by this rollout. It must match the pod
  # template's labels.
  selector:
    matchLabels:
      platform.centml.ai/deployment-id: "{{ .Values.deploymentId }}"

  # if set to true, the rollout will be paused
  paused: {{ .Values.rolloutPaused }}

  # Pod Template
  template:
    {{- /* proxy.istio.io/config: KEDA reads the sidecar's inbound downstream_rq stats.
           Outbound stats grow with every service in the mesh, so the sidecar does not
           emit them. */}}
    {{- $annotations := dict
          "platform.centml.ai/deployment-id" (toString .Values.deploymentId)
          "platform.centml.ai/revision-number" (.Values.revisionNumber | int64 | toString)
          "proxy.istio.io/config" `proxyStatsMatcher:
  inclusionRegexps:
  - "http\\.inbound.*downstream_rq.*"` }}
    {{- $labels := dict
          "platform.centml.ai/deployment-id" (toString .Values.deploymentId)
          "platform.centml.ai/revision-number" (.Values.revisionNumber | int64 | toString)
          "platform.centml.ai/custom_metrics" "enabled"
          "ccluster.nvidia.com/component-type" "user-container" }}
    {{- if not .Values.enableLogging }}
    {{- $_ := set $annotations "platform.centml.ai/log-exclude" "true" }}
    {{- end }}
    {{- with .Values.kaiQueue }}
    {{- $_ := set $labels "kai.scheduler/queue" (toString .) }}
    {{- end }}
    {{- range $key, $value := .Values.userAnnotations }}
    {{- $_ := set $annotations (printf "ccluster.nvidia.com/user-%s" $key) (toString $value) }}
    {{- $_ := set $labels (printf "ccluster.nvidia.com/user-%s" $key) (toString $value) }}
    {{- end }}
    metadata:
      annotations:
        {{- include "podMetadata" (dict "chart" $annotations "caller" .Values.podAnnotations) | nindent 8 }}
      labels:
        {{- include "podMetadata" (dict "chart" $labels "caller" .Values.podLabels) | nindent 8 }}
    spec:
      {{- if .Values.schedulerName }}
      schedulerName: {{ .Values.schedulerName }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- end }}
      # Security is enforced at namespace level via PSA "baseline".
      {{- if .Values.nodeAffinityLabels }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  {{- range $key, $value := .Values.nodeAffinityLabels }}
                  - key: {{ $key | quote }}
                    operator: In
                    values:
                      - {{ $value | quote }}
                  {{- end }}
      {{- end }}
      containers:
        - image: "{{ .Values.imageUrl }}"
          name: user-container
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: OMP_NUM_THREADS
              value: "{{ default 8 (divf (.Values.resources.limits.cpu | atoi) 2 | ceil | int) }}"
            {{- if .Values.enableNodeModelCache }}
            - name: HF_HUB_CACHE
              value: /tmp
            {{- end }}
            {{- range $key, $value := .Values.envVars }}
            - name: {{ $key | quote }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $key, $ref := .Values.secretEnvVars }}
            - name: {{ $key | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ $ref.secretName | quote }}
                  key: {{ $ref.key | quote }}
            {{- end }}
            {{- if .Values.hfToken }}
            - name: HF_TOKEN
              value: {{ .Values.hfToken | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.containerPort }}
              protocol: TCP
            # pods have a port named http-monitoring pointing to 15020 to get the right metrics from istio/envoy
            # this is already available and exposed to prometheus, but podmonitor needs it to be named
            - containerPort: 15020
              protocol: TCP
              name: http-monitoring
          readinessProbe:
            successThreshold: 1
            {{- if .Values.healthcheck }}
            httpGet:
              path: {{ .Values.healthcheck | quote }}
              port: {{ .Values.containerPort }}
            {{- else }}
            # TCP socket check for gRPC or when no healthcheck path is specified
            tcpSocket:
              port: {{ .Values.containerPort }}
            {{- end }}
          resources:
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}
              {{- with .Values.resources.limits }}
              {{- if .acceleratorCount }}
              {{ .acceleratorKey | default "nvidia.com/gpu" }}: {{ .acceleratorCount | int }}
              {{- end }}
              {{- end }}
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
              {{- with .Values.resources.requests }}
              {{- if .acceleratorCount }}
              {{ .acceleratorKey | default "nvidia.com/gpu" }}: {{ .acceleratorCount | int }}
              {{- end }}
              {{- end }}
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
            # See _helpers.tpl for instructions on how to define extraConfigFiles.
            # subPath/mountPath are quoted: a filename like "true" or "123" passes the
            # API regex but would otherwise render as a YAML bool/number and be
            # rejected by the k8s schema (subPath must be a string).
            {{- range .ExtraConfigFiles }}
            - name: {{ .configMapName }}
              readOnly: {{ .volumeMountReadOnly }}
              subPath: {{ .volumeMountSubPath | quote }}
              mountPath: {{ .volumeMountMountPath | quote }}
            {{- end }}
            {{- if .Values.enableNodeModelCache }}
            - name: model-cache
              mountPath: /tmp
            {{- end }}
            {{- range $mount := .Values.volumeMounts }}
            - mountPath: {{ $mount.mountPath | quote }}
              name: {{ get $volumeNameByClaim $mount.name }}
              readOnly: {{ $mount.readOnly | default false }}
            {{- end }}
      enableServiceLinks: false
      {{- with include "imagePullSecrets" .Values | trim }}
      imagePullSecrets:
        {{- . | nindent 8 }}
      {{- end }}
      tolerations:
        - effect: NoSchedule
          key: dedicated_compute
          operator: Equal
          value: "true"
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.devShmSize }}
        # See _helpers.tpl for instructions on how to define extraConfigFiles
        {{- range .ExtraConfigFiles }}
        - name: {{ .configMapName }}
          configMap:
            name: {{ .configMapName }}
        {{- end }}
        {{- if .Values.enableNodeModelCache }}
        - name: model-cache
          persistentVolumeClaim:
            claimName: node-model-cache-pvc
        {{- end }}
        {{- $renderedClaims := dict }}
        {{- range $mount := .Values.volumeMounts }}
        {{- if not (hasKey $renderedClaims $mount.name) }}
        {{- $_ := set $renderedClaims $mount.name true }}
        - name: {{ get $volumeNameByClaim $mount.name }}
          persistentVolumeClaim:
            claimName: {{ $mount.name | quote }}
        {{- end }}
        {{- end }}
  strategy:
    # Adding `trafficRouting` (e.g. istio) splits traffic across weighted
    # clusters, which breaks session_affinity — Envoy picks a cluster
    # randomly per request before applying hash (envoyproxy/envoy#8167).
    # Plain `steps: [{setWeight}]` without trafficRouting only adjusts
    # ReplicaSet pod counts and is safe.
    canary:

      # MaxSurge The maximum number of pods that can be scheduled above the original number of
      # pods.
      # Value can be an absolute number (ex: 5) or a percentage of total pods at
      # the start of the update (ex: 10%). This can not be 0 if MaxUnavailable is 0.
      # Absolute number is calculated from percentage by rounding up.
      # By default, a value of 25% is used.
      # Example: when this is set to 30%, the new RC can be scaled up by 30%
      # immediately when the rolling update starts. Once old pods have been killed,
      # new RC can be scaled up further, ensuring that total number of pods running
      # at any time during the update is at most 130% of original pods.      maxSurge: 1
      # See: https://github.com/argoproj/argo-rollouts/blob/master/pkg/apis/rollouts/v1alpha1/types.go
      # Note: values must be unquoted integers so argo-rollouts treats them as absolute pod counts,
      # not percentages (quoted strings are interpreted as percentages by argo-rollouts).
      maxSurge: {{ .Values.rolloutStrategy.maxSurge | int }}

  # MaxUnavailable The maximum number of pods that can be unavailable during the update.
      # Value can be an absolute number (ex: 5) or a percentage of total pods at the start of update (ex: 10%).
      # Absolute number is calculated from percentage by rounding down.
      # This can not be 0 if MaxSurge is 0.
      # By default, a fixed value of 25% is used.
      # Example: when this is set to 30%, the old RC can be scaled down by 30%
      # immediately when the rolling update starts. Once new pods are ready, old RC
      # can be scaled down further, followed by scaling up the new RC, ensuring
      # that at least 70% of original number of pods are available at all times
      # during the update.
      #
      # See: https://github.com/argoproj/argo-rollouts/blob/master/pkg/apis/rollouts/v1alpha1/types.go
      # Note: values must be unquoted integers so argo-rollouts treats them as absolute pod counts,
      # not percentages (quoted strings are interpreted as percentages by argo-rollouts).
      maxUnavailable: {{ .Values.rolloutStrategy.maxUnavailable | int }}
