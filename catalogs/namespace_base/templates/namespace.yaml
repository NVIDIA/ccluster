apiVersion: v1
kind: Namespace
metadata:
  labels:
    # Enable istio sidecar injection
    istio-injection: enabled
    # Enable ECR image pull secret for namespace
    ecr-anywhere.centml.ai/namespace: enabled
    # Enforce Pod Security Standard "baseline" for all pods in namespace.
    # Baseline allows root containers and default Docker capabilities (chown, setuid, etc.)
    # while blocking dangerous operations (privileged containers, hostPath, host namespaces).
    # https://kubernetes.io/docs/tasks/configure-pod-container/enforce-standards-namespace-labels/
    pod-security.kubernetes.io/enforce: baseline
  name: {{ .Release.Namespace }}

