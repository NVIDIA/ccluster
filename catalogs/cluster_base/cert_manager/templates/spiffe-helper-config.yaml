apiVersion: v1
kind: ConfigMap
metadata:
  name: cert-manager-spiffe-helper-config
  namespace: {{ .Release.Namespace }}
data:
  spiffe-helper.conf: |
    agent_address = "/spiffe-workload-api/spire-agent.sock"
    daemon_mode = true
    cert_dir = "/var/run/secrets/spiffe"

    jwt_svids = [
      {
        jwt_audience = "sts.amazonaws.com"
        jwt_svid_file_name = "token"
      }
    ]
