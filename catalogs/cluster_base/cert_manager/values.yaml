cert-manager:
  crds:
    enabled: true
    # The upstream default, pinned. The chart adds helm.sh/resource-policy: keep to the
    # CRDs, which Argo CD treats as Delete=false: deleting this component leaves the CRDs,
    # Certificates and Issuers.
    keep: true
  replicaCount: 2
  webhook:
    replicaCount: 2
  cainjector:
    replicaCount: 2
  serviceAccount:
    create: true
    name: cert-manager
  # Re-enable once kube-prometheus-stack is deployed (provides the
  # ServiceMonitor CRD).
  prometheus:
    enabled: false
    servicemonitor:
      enabled: false
