cert-manager:
  installCRDs: true
  replicaCount: 2
  webhook:
    replicaCount: 2
  cainjector:
    replicaCount: 2
  serviceAccount:
    create: true
    name: cert-manager
  # Re-enable once kube-prometheus-stack is deployed (provides the
  # ServiceMonitor CRD).
  prometheus:
    enabled: false
    servicemonitor:
      enabled: false
