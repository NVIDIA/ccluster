gateway-crds-helm:
  crds:
    gatewayAPI:
      enabled: true
      # The upstream chart defaults to experimental. The safe-upgrades
      # ValidatingAdmissionPolicy installed with the CRDs rejects experimental CRDs
      # over standard ones, so changing this on an installed cluster fails.
      channel: standard
    # Envoy Gateway's own CRDs. Off: no Envoy Gateway controller runs.
    envoyGateway:
      enabled: false
