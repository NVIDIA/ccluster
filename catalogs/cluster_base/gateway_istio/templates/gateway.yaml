# The cluster's shared Gateway. istiod generates its Deployment, Service, HPA and PDB
# and reverts direct edits to them. The deployment charts and acme-ca's HTTP-01 solver
# reference it as gateway-system/ccl-gateway, so its name and namespace are fixed.
#
# istiod copies the Gateway's labels and annotations onto the generated pod template,
# so changing them rolls the gateway pods.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ccl-gateway
  namespace: gateway-system
spec:
  # The GatewayClass istiod creates itself.
  gatewayClassName: istio
  infrastructure:
    # istiod copies these onto the generated Service. The infra-plane operator reports
    # its address in CCLClusterConfig's status.loadBalancers as "gateway", which the
    # control plane points "*.gateway.<domain>" at.
    labels:
      ccluster.nvidia.com/loadbalancer: gateway
    parametersRef:
      group: ""
      kind: ConfigMap
      name: ccl-gateway-params
  # Each deployment brings its own HTTPS listener and certificate in a ListenerSet in its
  # namespace. Only tenant namespaces may attach one.
  allowedListeners:
    namespaces:
      from: Selector
      selector:
        matchLabels:
          ccluster.nvidia.com/tenant: "true"
  listeners:
    # Serves the HTTP-01 challenge routes cert-manager creates in each Certificate's
    # namespace, so it admits routes from tenant namespaces.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              ccluster.nvidia.com/tenant: "true"
