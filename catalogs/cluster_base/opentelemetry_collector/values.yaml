opentelemetry-collector:
  # Both fields are required by chart 0.130.2 — the upstream removed
  # the defaults to force callers to pick image + mode deliberately.
  # See: https://github.com/open-telemetry/opentelemetry-helm-charts/blob/main/charts/opentelemetry-collector/UPGRADING.md
  mode: deployment
  image:
    repository: otel/opentelemetry-collector-contrib
  # Stub config — replace with your real receivers / processors /
  # exporters. Without this the deployment fails its config validation.
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    exporters:
      debug: {}
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
