apiVersion: v2
name: cluster_base_istio
type: application
version: 0.1.0
appVersion: "1.24.6"

dependencies:
  - name: base
    alias: istio-base
    version: 1.24.6
    repository: https://istio-release.storage.googleapis.com/charts
  - name: istiod
    version: 1.24.6
    repository: https://istio-release.storage.googleapis.com/charts
  - name: gateway
    alias: istio-gateway
    version: 1.24.6
    repository: https://istio-release.storage.googleapis.com/charts
    # Gateway pods use `image: auto` and depend on istiod's mutating
    # webhook to inject the real istio-proxy image at admission. If
    # gateway pods are created before istiod is Ready, kubelet tries
    # to literally pull "auto" → ImagePullBackOff. Two-phase install:
    # first apply with this disabled so istiod comes up cleanly, then
    # flip istio-gateway.enabled=true and re-apply.
    condition: istio-gateway.enabled
  - name: cni
    alias: istio-cni
    version: 1.24.6
    repository: https://istio-release.storage.googleapis.com/charts
