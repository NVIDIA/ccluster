istio-base:
  defaultRevision: default

istiod:
  pilot:
    autoscaleMin: 2
  cni:
    enabled: true
  defaultPodDisruptionBudget:
    enabled: true
    minAvailable: 1

istio-gateway:
  # Disabled by default to avoid the istiod-webhook race on first
  # install. Run `helm upgrade ... --set istio-gateway.enabled=true`
  # in a second pass once istiod is Ready.
  enabled: false
  service:
    annotations: {}
    externalTrafficPolicy: Cluster
    ports:
      - name: status-port
        port: 15021
        protocol: TCP
        targetPort: 15021
      - name: http2
        port: 80
        protocol: TCP
        targetPort: 8080
      - name: https
        port: 443
        protocol: TCP
        targetPort: 8443
  autoscaling:
    enabled: true
    minReplicas: 4
    maxReplicas: 8
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

istio-cni:
  cni:
    # Where istio-cni writes its CNI configuration and plugin binary. The
    # defaults are the standard paths, correct for EKS, kind and kubeadm.
    # Other node images need their own:
    #   GKE (COS): cniBinDir=/home/kubernetes/bin. /opt/cni/bin is mounted
    #              read-only there, and the binary copy fails.
    #   k3s/k3d:   cniConfDir=/var/lib/rancher/k3s/agent/etc/cni/net.d and
    #              cniBinDir=/var/lib/rancher/k3s/data/cni, where k3s keeps
    #              its CNI configuration and plugins.
    # With the wrong paths istio-cni-node never becomes ready.
    cniConfDir: /etc/cni/net.d
    cniBinDir: /opt/cni/bin
    # When a pod (e.g. ingress-nginx) is scheduled onto a node before
    # istio-cni-node has installed iptables rules, the istio-validation
    # init container fails and the pod CrashLoopBackOffs forever. Delete
    # the broken pod so it reschedules onto a node with CNI ready,
    # instead of trying to repair it in place.
    repair:
      repairPods: false
      deletePods: true

# In-chart DaemonSet patch for the istio-cni-node DaemonSet when Cilium
# is the cluster CNI. Rendered by templates/cilium-patch.yaml.
ciliumIstioPatch:
  enabled: false
