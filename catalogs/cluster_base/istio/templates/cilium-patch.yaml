{{- if .Values.ciliumIstioPatch.enabled }}
{{/*
On Cilium clusters, the istio-cni-node DaemonSet's default wildcard
tolerations (operator: Exists) let it schedule on a node before
cilium-agent is Ready. If istio-cni writes its CNI config before
cilium finishes setting up node networking, pods on that node end up
with broken networking until the istio-cni pod is deleted and
recreated.

This patch replaces the wildcard tolerations with a single explicit
toleration. The pod then no longer tolerates
`node.cilium.io/agent-not-ready` (the taint cilium-agent puts on a
node until it's Ready), so it waits for cilium before scheduling.
The DaemonSet controller still auto-adds tolerations for
not-ready/unreachable/disk-pressure/etc., so the daemon can still
run everywhere it needs to.

`tolerations` is an atomic list in the API, so SSA needs Force=true
to take ownership from the istio-cni helm chart's field manager.
*/}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: istio-cni-node
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true,Force=true
spec:
  template:
    spec:
      tolerations:
        - key: dedicated_compute
          operator: Equal
          value: "true"
          effect: NoSchedule
{{- end }}
