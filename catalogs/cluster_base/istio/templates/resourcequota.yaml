apiVersion: v1
kind: ResourceQuota
metadata:
  name: istio-critical-pods
  namespace: {{ .Release.Namespace }}
spec:
  # On clusters (e.g. GKE) where the ResourceQuota admission plugin
  # gates `system-node-critical` / `system-cluster-critical` priority
  # classes, the istio-cni-node DaemonSet (and istiod, which uses
  # system-cluster-critical) cannot create pods unless a matching
  # quota exists in this namespace.
  hard:
    pods: "1024"
  scopeSelector:
    matchExpressions:
      - operator: In
        scopeName: PriorityClass
        values:
          - system-node-critical
          - system-cluster-critical
