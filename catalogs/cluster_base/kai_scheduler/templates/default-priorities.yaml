{{- if .Values.defaultPriorities.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kai-default-priorities
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster_base.labels" . | nindent 4 }}
data:
  types: {{ .Values.defaultPriorities.types | toJson | quote }}
{{- end }}
