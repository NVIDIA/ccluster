apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: prometheus
spec:
  spiffeIDTemplate: "spiffe://{{ .Values.global.cluster.domain }}/ns/prometheus/sa/prometheus"
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: prometheus
