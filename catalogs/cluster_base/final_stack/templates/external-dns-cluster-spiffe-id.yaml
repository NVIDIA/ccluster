apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: external-dns
spec:
  spiffeIDTemplate: "spiffe://{{ .Values.global.cluster.domain }}/ns/external-dns/sa/external-dns"
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-dns
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: external-dns
