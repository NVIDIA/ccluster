teleport-kube-agent:
  roles: kube
  proxyAddr: "<PROXY_ADDR>"
  teleportClusterName: "<CLUSTER_NAME>"
  kubeClusterName: "<KUBE_CLUSTER>"
  joinParams:
    method: kubernetes
    tokenName: "<TOKEN>"
  enterprise: true
  highAvailability:
    replicaCount: 2
    requireAntiAffinity: true
