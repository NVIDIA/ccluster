apiVersion: v1
kind: ResourceQuota
metadata:
  name: gpu-operator-critical-pods
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster_base.labels" . | nindent 4 }}
spec:
  # On clusters (e.g. GKE) where the ResourceQuota admission plugin
  # gates `system-node-critical` / `system-cluster-critical` priority
  # classes, no gpu-operator pod (the operator, node-feature-discovery
  # and the ClusterPolicy operand DaemonSets, all system-node-critical)
  # can be created unless a matching quota exists in this namespace.
  hard:
    # gpu-operator runs about 7-8 critical pods per GPU node with the
    # driver and toolkit enabled, so this covers roughly 250 GPU nodes.
    pods: "2048"
  scopeSelector:
    matchExpressions:
      - operator: In
        scopeName: PriorityClass
        values:
          - system-node-critical
          - system-cluster-critical
