{{- if .Values.prometheusRules.podAlerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pod-alert-rules
  namespace: {{ default "prometheus" (index .Values "kube-prometheus-stack" "namespaceOverride") }}
  labels:
    {{- include "cluster_base.labels" . | nindent 4 }}
    release: kube-prometheus-stack
spec:
  groups:
    - name: pod-alerts
      rules:
        - alert: PodRestartRate
          expr: |
            sum by (namespace, pod) (
              rate(kube_pod_container_status_restarts_total[15m])
            ) * 60 * 15 > 3
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} restarting frequently"
            description: "Pod has restarted more than 3 times in the last 15 minutes."
        - alert: PodStuckTerminating
          expr: |
            (time() - kube_pod_deletion_timestamp) > 600
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} stuck terminating"
            description: "Pod has been terminating for more than 10 minutes."
        - alert: KubeHpaMaxedOut
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas
              == kube_horizontalpodautoscaler_spec_max_replicas
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "HPA {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.horizontalpodautoscaler {{ "}}" }} at max replicas"
            description: "HPA has been at max replicas for 15 minutes."
{{- end }}
