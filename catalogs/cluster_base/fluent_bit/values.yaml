fluent-bit:
  serviceAccount:
    # Create the SA in-chart for standalone testing. Flip to false and
    # pre-create externally (e.g. via IRSA in Pulumi) for production.
    create: true
    name: fluentbit
  config:
    service: |
      [SERVICE]
          Daemon Off
          Flush 1
          Log_Level info
          Parsers_File /fluent-bit/etc/parsers.conf
          HTTP_Server On
          HTTP_Listen 0.0.0.0
          HTTP_Port 2020
          Health_Check On
    inputs: |
      [INPUT]
          Name tail
          Path /var/log/containers/*.log
          multiline.parser docker, cri
          Tag kube.*
          Mem_Buf_Limit 5MB
          Skip_Long_Lines On
    filters: |
      [FILTER]
          Name kubernetes
          Match kube.*
          Merge_Log On
          Keep_Log Off
          K8S-Logging.Parser On
          K8S-Logging.Exclude On
    # Fan logs back to fluent-bit's own stdout — visible via
    # `kubectl -n fluent-bit logs ds/fluent-bit`. Replace with
    # cloudwatch_logs / es / loki / kafka / etc. for production.
    outputs: |
      [OUTPUT]
          Name stdout
          Match *
  # k3d uses containerd, not docker, and the node containers don't ship
  # /etc/machine-id. Drop both upstream defaults; keep only /var/log
  # (where containerd symlinks pod logs).
  daemonSetVolumes:
    - name: varlog
      hostPath:
        path: /var/log
  daemonSetVolumeMounts:
    - name: varlog
      mountPath: /var/log
