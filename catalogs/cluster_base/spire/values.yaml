spire:
  global:
    # ArgoCD renders the chart via `helm template`, which doesn't run
    # Helm hooks the way `helm install` does. The spire chart's own
    # docs say these hooks should be disabled in that case. With them
    # enabled, the chart's pre-upgrade hook (translated by ArgoCD to
    # PreSync) tries to `kubectl patch` the validating webhook before
    # it exists in Sync, dies with NotFound, and blocks the sync
    # forever. The chart resolves the per-component
    # `controllerManager.installAndUpgradeHook.enabled` via `dig` from
    # `.global.installAndUpgradeHooks.enabled` (plural) first, so we
    # have to set the global to override the umbrella default of true.
    installAndUpgradeHooks:
      enabled: false
    deleteHooks:
      enabled: false
  spire-server:
    # Ephemeral datastore: the spire-server CA / registration DB lives on an
    # emptyDir rather than a PVC. The chart's StatefulSet volumeClaimTemplate
    # exposes no persistentVolumeClaimRetentionPolicy, so a PVC would survive
    # cluster teardown (neither ArgoCD nor k8s prune volumeClaimTemplate PVCs)
    # and poison the next registration with a stale trust-domain CA. With
    # emptyDir there is no PVC to leak; the CA is rebuilt on pod (re)start.
    persistence:
      type: emptyDir
  # OIDC discovery provider is only useful when you wire SPIRE JWTs
  # into AWS IAM (via the AWS OIDC provider sync). For standalone /
  # local testing it just fails-mounts looking for the externally-
  # provided TLS secret. Re-enable in production and set
  # tls.externalSecret.* (or tls.spire.enabled=true for self-signed).
  spiffe-oidc-discovery-provider:
    enabled: true
    tls:
      spire:
        enabled: false
      externalSecret:
        enabled: false
    ingress:
      enabled: false
  spiffe-csi-driver:
    enabled: true
    # Kubelet's data root — where plugins_registry/ and pods/ live.
    # k3s/k3d uses the upstream default (/var/lib/kubelet) even though
    # the config file lives under /var/lib/rancher/k3s/agent/kubelet/.
    kubeletPath: /var/lib/kubelet
