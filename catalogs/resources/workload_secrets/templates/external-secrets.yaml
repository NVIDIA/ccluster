{{- /* One deployment's ExternalSecrets; see component.go.
       - No Argo CD annotation. The cp operator releases this component before the
         workload, and deletes it, with its Secrets, only after the workload is finished.
       - target.template.metadata is always set, so the Secret carries only these labels:
         without a template, ESO copies the ExternalSecret's own labels and annotations
         onto it. */ -}}
{{- $labels := dict "app.kubernetes.io/instance" .Release.Name }}
{{- $store := .Values.secretStoreRef | default dict }}
{{- with .Values.env }}
{{- $name := include "workloadSecrets.name" (dict "values" $.Values "block" "env") }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: {{ required "secretStoreRef.name is required" $store.name | quote }}
    kind: {{ required "secretStoreRef.kind is required" $store.kind | quote }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    immutable: true
    template:
      metadata:
        labels:
          {{- toYaml $labels | nindent 10 }}
  data:
    {{- range $key, $ref := . }}
    - secretKey: {{ $key | quote }}
      remoteRef:
        {{- include "workloadSecrets.remoteRef" $ref | nindent 8 }}
    {{- end }}
{{- end }}
{{- with .Values.imagePull }}
{{- $name := include "workloadSecrets.name" (dict "values" $.Values "block" "pull") }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: {{ required "secretStoreRef.name is required" $store.name | quote }}
    kind: {{ required "secretStoreRef.kind is required" $store.kind | quote }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    immutable: true
    template:
      type: kubernetes.io/dockerconfigjson
      metadata:
        labels:
          {{- toYaml $labels | nindent 10 }}
      {{- /* ESO renders .dockerconfigjson when it creates the Secret, so the password
             never enters the values. quote turns server and username into Go string
             literals in ESO's template. The |- block scalar keeps YAML from reading the
             leading "{" as a flow mapping. */}}
      data:
        .dockerconfigjson: |-
          {{ "{{" }} dict "auths" (dict {{ .server | quote }} (dict "username" {{ .username | quote }} "password" .password "auth" (printf "%s:%s" {{ .username | quote }} .password | b64enc))) | toJson {{ "}}" }}
  data:
    - secretKey: password
      remoteRef:
        {{- include "workloadSecrets.remoteRef" .password | nindent 8 }}
{{- end }}
