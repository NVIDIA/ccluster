# A minimal stand-in for Argo CD's ApplicationSet CRD, so envtest can store the
# ApplicationSets the control-plane operator creates.
#
# The real CRD ships only as a Helm template inside the argo-cd chart
# (argo-cd/templates/crds/crd-applicationset.yaml in
# charts/cp/chart/charts/argo-cd-*.tgz), so it cannot simply be copied into
# CRDDirectoryPaths. The schema is left open: these tests assert what the operator
# writes, not that Argo CD's own validation accepts it - that is what
# `make test-e2e-argocd` and a real cluster are for.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: applicationsets.argoproj.io
spec:
  group: argoproj.io
  names:
    kind: ApplicationSet
    listKind: ApplicationSetList
    plural: applicationsets
    singular: applicationset
    shortNames:
      - appset
      - appsets
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
