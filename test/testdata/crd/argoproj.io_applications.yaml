# A minimal stand-in for Argo CD's Application CRD, so envtest can serve the
# Applications the control-plane operator reads back when reporting rollout progress.
#
# The real CRD ships only as a Helm template inside the argo-cd chart
# (argo-cd/templates/crds/crd-application.yaml in charts/cp/chart/charts/argo-cd-*.tgz),
# so it cannot simply be copied into CRDDirectoryPaths. The schema is left open on
# purpose: the tests only need the objects stored and read back, not validated.
#
# In a real cluster the operator creates these and Argo CD fills in their status. envtest
# runs no Argo CD, so the tests write the status themselves to drive the rollout forward.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: applications.argoproj.io
spec:
  group: argoproj.io
  names:
    kind: Application
    listKind: ApplicationList
    plural: applications
    singular: application
    shortNames:
      - app
      - apps
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # Match Argo CD: status is an ordinary field. A status subresource would hide
      # whole-object updates that accidentally drop status fields.
      subresources: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            # Argo CD queues a requested sync here, outside status. Declared so a test
            # can assert the operator's spec write leaves a pending one alone.
            operation:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            # status.sync.status is required by the real CRD. Modelled here rather
            # than left open because the operator must not send an empty status when
            # creating an Application, and only this catches that without a cluster.
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                sync:
                  type: object
                  # Argo CD writes more sync fields than the operator models; the
                  # tests assert those survive a spec rewrite.
                  x-kubernetes-preserve-unknown-fields: true
                  required: [status]
                  properties:
                    status:
                      type: string
