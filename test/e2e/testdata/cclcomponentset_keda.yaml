# A single-component keda CCLComponentSet whose operator replica count is a parameter, so a
# values change can be applied over an existing deployment.
apiVersion: ccluster.nvidia.com/v1alpha1
kind: CCLComponentSet
metadata:
  name: {{ .Name }}
  namespace: {{ .Namespace }}
spec:
  components:
    - name: keda
      infraPlaneRef:
        name: {{ .PlaneName }}
      chart: catalogs/cluster_base/keda
      namespace: keda
      values:
        keda:
          operator:
            replicaCount: {{ .OperatorReplicas }}
