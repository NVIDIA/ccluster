# A single-component keda CCLDeployment whose operator replica count is a parameter, so a
# values change can be applied over an existing deployment.
apiVersion: ccluster.nvidia.com/v1alpha1
kind: CCLDeployment
metadata:
  name: {{ .Name }}
  namespace: {{ .Namespace }}
spec:
  components:
    - name: keda
      infraPlaneRef:
        name: {{ .PlaneName }}
      chart: catalogs/cluster_base/keda
      namespace: keda
      values:
        keda:
          operator:
            replicaCount: {{ .OperatorReplicas }}
