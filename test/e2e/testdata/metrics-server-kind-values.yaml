#
# catalogs/cluster_base/metrics_server's args, plus --kubelet-insecure-tls: kind's
# kubelets serve self-signed certificates, so metrics-server never scrapes them, never
# becomes ready, and its APIService never becomes Available without it.
metrics-server:
  args:
    - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
    - --kubelet-use-node-status-port
    - --metric-resolution=15s
    - --kubelet-insecure-tls
