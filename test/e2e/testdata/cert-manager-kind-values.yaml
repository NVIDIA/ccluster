# The cert_manager Verifier checks that the webhook is registered, has its CA bundle and
# is served, which one replica of each component shows as well as two.
cert-manager:
  replicaCount: 1
  webhook:
    replicaCount: 1
  cainjector:
    replicaCount: 1
