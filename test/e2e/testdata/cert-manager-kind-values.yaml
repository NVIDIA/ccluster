#
# The cert_manager Verifier checks that the webhook is registered, has its CA bundle and
# is served, that the CRDs exist, and that a controller holds its leader Lease. One
# replica of each component shows all of that as well as two.
cert-manager:
  replicaCount: 1
  webhook:
    replicaCount: 1
  cainjector:
    replicaCount: 1
