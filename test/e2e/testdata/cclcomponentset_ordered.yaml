# A two-component CCLComponentSet, argo-rollouts then keda, matching
# examples/quickstart/v1alpha1_cclcomponentset.yaml. Order is the position in the list.
apiVersion: ccluster.nvidia.com/v1alpha1
kind: CCLComponentSet
metadata:
  name: {{ .Name }}
  namespace: {{ .Namespace }}
spec:
  components:
    - name: argo-rollouts
      infraPlaneRef:
        name: {{ .PlaneName }}
      chart: catalogs/cluster_base/argo_rollouts
      namespace: argo-rollouts
    - name: keda
      infraPlaneRef:
        name: {{ .PlaneName }}
      chart: catalogs/cluster_base/keda
      namespace: keda
      values:
        keda:
          operator:
            replicaCount: 1
