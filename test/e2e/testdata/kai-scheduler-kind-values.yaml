#
# The kai_scheduler Verifier reads only the kai-config Config, which the chart's hook Job
# applies. The chart's resource requests are sized for large production clusters; these
# keep the KAI components it deploys from crowding a kind node.
kai-scheduler:
  scheduler:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  binder:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 512Mi
  operator:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
