# The CCLClusterConfig singleton, applied by hand to a cluster no CCLInfraPlane
# registers. Plain YAML, not a template: there is one per cluster, named "cluster".
apiVersion: ccluster.nvidia.com/v1alpha1
kind: CCLClusterConfig
metadata:
  name: cluster
spec:
  domain: ccluster-e2e.example.com
