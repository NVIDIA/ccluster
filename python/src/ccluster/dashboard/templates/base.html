<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · ccluster</title>
  <link rel="stylesheet" href="{{ url_for('static', path='dashboard.css').path }}">
  <script src="{{ url_for('static', path='dashboard.js').path }}" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">ccluster</a>
    <form id="namespace-form" class="namespace" method="get" action="/">
      <label for="namespace">Namespace</label>
      <select id="namespace" name="namespace">
        {% if offer_all %}<option value=""{% if selected is none %} selected{% endif %}>All namespaces</option>{% endif %}
        {% for option in options %}
        <option value="{{ option }}"{% if option == selected %} selected{% endif %}>{{ option }}</option>
        {% endfor %}
      </select>
      <button type="submit">Open</button>
    </form>
    {% if user %}<span class="user">Signed in as {{ user }}</span>{% endif %}
  </header>
  <p id="refresh-notice" class="notice" hidden></p>
  <main id="content"{% if view is defined %} data-refresh-seconds="{{ refresh_seconds }}"{% endif %}>
    {%- block content %}{% endblock -%}
  </main>
</body>
</html>
