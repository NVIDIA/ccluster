{{- $homeClaimName := default .Values.name .Values.home_pvc_name }}
{{- $volumeNameByClaim := dict $homeClaimName "compute-volume" }}
{{- range $index, $mount := .Values.volume_mounts }}
{{- if not (hasKey $volumeNameByClaim $mount.name) }}
{{- $_ := set $volumeNameByClaim $mount.name (printf "external-volume-%d" $index) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    platform.centml.ai/deployment-id: "{{ .Values.deployment_id | int }}"
    platform.centml.ai/user-id: "{{ .Values.user_id | int }}"
  labels:
    platform.centml.ai/deployment-id: "{{ .Values.deployment_id | int }}"
    platform.centml.ai/workload_type: compute
  name: "{{ .Values.name }}"
  namespace: user-{{ .Values.user_id | int }}
spec:
  replicas: 1
  # Home volume (and any additional volume_mounts) are ReadWriteOnce; RollingUpdate would try to
  # schedule the new pod before the old one releases the PVC, leaving it stuck unable to attach.
  strategy:
    type: Recreate
  selector:
    matchLabels:
        platform.centml.ai/deployment-id: "{{ .Values.deployment_id | int }}"
        platform.centml.ai/workload_type: compute
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
        platform.centml.ai/deployment-id: "{{ .Values.deployment_id | int }}"
        platform.centml.ai/user-id: "{{ .Values.user_id | int }}"
        {{- /*
        Guarded on key presence so a chart bump alone never restarts a running workload.
        ArgoCD stores helm.values as a literal string written at the last API push, so a
        deployment untouched since this annotation was introduced has no revision_number
        key at all -- re-rendering it leaves the pod template byte-identical and nothing
        is recreated. The revision metadata appears on the next push that already restarts the
        workload (create, update, or rollout), where the API always supplies the key.
        Test key presence, not truthiness: legacy values omit the key rather than null it.
        */}}
        {{- if hasKey .Values "revision_number" }}
        platform.centml.ai/revision-number: "{{ .Values.revision_number | int }}"
        {{- end }}
        {{- if not .Values.enable_logging }}
        platform.centml.ai/log-exclude: "true"
        {{- end }}
        {{- if .Values.user_annotations }}
        {{- range $key, $value := .Values.user_annotations }}
        ccluster.nvidia.com/user-{{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- end }}
      labels:
        platform.centml.ai/deployment-id: "{{ .Values.deployment_id | int }}"
        {{- if hasKey .Values "revision_number" }}
        platform.centml.ai/revision-number: "{{ .Values.revision_number | int }}"
        {{- end }}
        platform.centml.ai/workload_type: compute
        ccluster.nvidia.com/component-type: user-container
        {{- if .Values.kai_queue }}
        kai.scheduler/queue: {{ .Values.kai_queue | quote }}
        {{- end }}
        {{- if .Values.user_annotations }}
        {{- range $key, $value := .Values.user_annotations }}
        ccluster.nvidia.com/user-{{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- end }}
      name: "{{ .Values.name }}"
      namespace: user-{{ .Values.user_id | int }}
    spec:
      {{- if .Values.scheduler_name }}
      schedulerName: {{ .Values.scheduler_name }}
      {{- end }}
      {{- if .Values.priority_class_name }}
      priorityClassName: {{ .Values.priority_class_name | quote }}
      {{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                {{- range $key, $value := .Values.node_affinity_labels }}
                - key: {{ $key | quote }}
                  operator: In
                  values:
                    - {{ $value | quote }}
                {{- end }}
      initContainers:
        - name: ssh-launcher-init
          image: "{{ .Values.ssh_injector_image }}"
          command:
            - /compute-ssh
            - install
            - /ssh-bin/compute-ssh
          volumeMounts:
            - mountPath: /ssh-bin
              name: ssh-launcher
      containers:
        - env:
          - name: "CCLUSTER_SSH_ADDR"
            value: ":{{ .Values.container_port }}"
          - name: "CCLUSTER_SSH_HOST_KEY_DIR"
            value: "/home/.ccluster/ssh{{ if .Values.home_pvc_name }}/{{ .Values.deployment_id | int }}{{ end }}"
          - name: "CCLUSTER_SSH_WORKDIR"
            value: "/home"
          {{- range $key, $value := .Values.env_vars }}
          - name: {{ $key | quote }}
            value: {{ $value | quote }}
          {{- end }}

          # if the customer has provided a private key, we need to mount it into the container
          # and point to it from this env var
          {{- if .Values.ssh_public_key }}
          - name: "SSH_PUBLIC_KEY_FILE"
            value: "/authorized_keys"
          {{- end }}
    
          # if the customer has provided a github username, we need to set it as an env var
          {{- if .Values.ssh_github_username }}
          - name: "SSH_GITHUB_USERNAME"
            value: {{ .Values.ssh_github_username | quote }}
          {{- end }}

          # if  the customer has provided a username we need to set it as an env var
          {{- if .Values.ssh_username }}
          - name: "SSH_USERNAME"
            value: {{ .Values.ssh_username | quote }}
          {{- end }}

          # if the customer has provided a password we need to load the secret into an env var
          {{- if .Values.ssh_password }}
          - name: "SSH_PASSWORD"
            valueFrom:
              secretKeyRef:
                key: ssh_password
                name: ssh-password-{{ .Values.deployment_id | int }}
          {{- end }}

          image: "{{ .Values.image_url }}"
          command:
            - /ccluster/compute-ssh/compute-ssh
          name: user-container
          # A compute deployment is an interactive box; keep its SSH identity
          # consistent instead of inheriting an arbitrary image's USER.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          ports:
            - containerPort: {{ .Values.container_port }}
              protocol: TCP
          resources:
            limits:
              cpu: "{{ .Values.resources.limits.cpu}}"
              memory: "{{ .Values.resources.limits.memory}}"
              {{ .Values.resources.limits.accelerator_key }}: {{ .Values.resources.limits.accelerator_count }}
            requests:
              cpu: "{{ .Values.resources.requests.cpu }}"
              memory: "{{ .Values.resources.requests.memory }}"
              {{ .Values.resources.requests.accelerator_key }}: {{ .Values.resources.requests.accelerator_count }}
          volumeMounts:
            - mountPath: /ccluster/compute-ssh
              name: ssh-launcher
              readOnly: true
            - mountPath: /home
              name: compute-volume
            - mountPath: /dev/shm
              name: dshm
          {{- range $mount := .Values.volume_mounts }}
            - mountPath: {{ $mount.mount_path | quote }}
              name: {{ get $volumeNameByClaim $mount.name }}
              readOnly: {{ $mount.read_only }}
          {{- end }}
          {{- if .Values.ssh_public_key }}
            # note we can't overlay mounts unfortunately
            - mountPath: /authorized_keys
              subPath: authorized_keys
              name: authorized-keys
          {{- end }}
      imagePullSecrets:
        - name: ecr-image-pull
        {{- if .Values.image_pull_secret }}
        - name: {{ .Values.name }}-image-pull-secret
        {{- end }}

      securityContext:
        fsGroup: 1001
        # Need to add extra group ids if we are using an AMD gpu as the group id is not consistent
        # More details on why this is need is found here: https://github.com/CentML/platform/issues/1917
        {{- if .Values.supplemental_group_ids }}
        supplementalGroups:
          {{- range .Values.supplemental_group_ids }}
          - {{ . }}
          {{- end }}
        {{- end }}
      tolerations:
        - effect: NoSchedule
          key: dedicated_compute
          operator: Equal
          value: "true"
      volumes:
        - name: ssh-launcher
          emptyDir: {}
        - name: compute-volume
          persistentVolumeClaim:
            claimName: {{ $homeClaimName | quote }}
        - emptyDir:
            medium: Memory
            sizeLimit: {{ default "512Mi" .Values.dev_shm_size }}
          name: dshm
      {{- $renderedClaims := dict $homeClaimName true }}
      {{- range $mount := .Values.volume_mounts }}
      {{- if not (hasKey $renderedClaims $mount.name) }}
      {{- $_ := set $renderedClaims $mount.name true }}
        - name: {{ get $volumeNameByClaim $mount.name }}
          persistentVolumeClaim:
            claimName: {{ $mount.name | quote }}
      {{- end }}
      {{- end }}
      {{- if .Values.ssh_public_key }}
        - name: authorized-keys
          configMap:
            name: authorized-keys-{{ .Values.deployment_id | int }}
      {{- end }}
