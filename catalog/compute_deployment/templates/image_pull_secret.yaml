{{- if .Values.image_pull_secret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-image-pull-secret
  namespace: user-{{ .Values.user_id | int }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: |
    {{- $server := .Values.image_pull_secret.server -}}
    {{- $username := .Values.image_pull_secret.username_base64 | b64dec -}}
    {{- $password := .Values.image_pull_secret.password_base64 | b64dec -}}
    {{- $auth := printf "%s:%s" $username $password | b64enc -}}
    {{- $cfg := dict "auths" (dict $server (dict "username" $username "password" $password "auth" $auth)) -}}
    {{- $cfg | toJson | b64enc | nindent 4 }}
{{- end }}
