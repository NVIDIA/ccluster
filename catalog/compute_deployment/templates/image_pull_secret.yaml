{{- if .Values.image_pull_secret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-image-pull-secret
  namespace: user-{{ .Values.user_id }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: |
    {{- $server := .Values.image_pull_secret.server -}}
    {{- $username := .Values.image_pull_secret.username_base64 | b64dec -}}
    {{- $password := .Values.image_pull_secret.password_base64 | b64dec -}}
    {{- printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}" $server $username $password (printf "%s:%s" $username $password | b64enc) | b64enc | nindent 4 }}
{{- end }}
