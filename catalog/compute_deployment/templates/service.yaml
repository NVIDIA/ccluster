apiVersion: v1
kind: Service
metadata:
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-type: external
    external-dns.alpha.kubernetes.io/hostname: {{ default (printf "%s.user-%d.%s" .Values.name (.Values.user_id | int) .Values.domain) .Values.deployment_url }}
  labels:
    platform.centml.ai/deployment_id: "{{ .Values.deployment_id }}"
  name: "{{ .Values.name }}"
  namespace: user-{{ .Values.user_id }}
spec:
  ports:
    - name: ssh
      port: {{ .Values.exposed_port }}
      targetPort: {{ .Values.container_port }}
  selector:
    platform.centml.ai/deployment-id: "{{ .Values.deployment_id }}"
  type: LoadBalancer
