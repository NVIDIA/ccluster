apiVersion: scheduling.run.ai/v2
kind: Queue
metadata:
  name: {{ .Values.ccluster_root_queue }}
  labels:
    app.kubernetes.io/managed-by: centml
    platform.centml.ai/gpu-quota: "true"
spec:
  resources:
    cpu:
      {{- include "kaiGpuQueues.unlimited" . | nindent 6 }}
    gpu:
      {{- include "kaiGpuQueues.unlimited" . | nindent 6 }}
    memory:
      {{- include "kaiGpuQueues.unlimited" . | nindent 6 }}
{{- range .Values.org_queues }}
---
{{/* Soft-deleted orgs stay in values at quota 0 so prune does not drop the CR. */}}
apiVersion: scheduling.run.ai/v2
kind: Queue
metadata:
  name: {{ .queue_name }}
  labels:
    app.kubernetes.io/managed-by: centml
    platform.centml.ai/gpu-quota: "true"
spec:
  parentQueue: {{ $.Values.ccluster_root_queue }}
  resources:
    cpu:
      {{- include "kaiGpuQueues.unlimited" $ | nindent 6 }}
    gpu:
      quota: {{ .gpu_quota | int }}
      limit: {{ .gpu_quota | int }}
      overQuotaWeight: 1
    memory:
      {{- include "kaiGpuQueues.unlimited" $ | nindent 6 }}
{{- end }}
