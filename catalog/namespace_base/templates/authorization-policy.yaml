apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: namespace-default
  namespace: user-{{ .Values.user_id }}
spec:
  action: ALLOW
  rules:
  - from:
    - source:
        namespaces: [
          # Communication within the namespace
          "user-{{ .Values.user_id }}",
        ]
    - source:
        # Prometheus for metrics. 
        namespaces: ["prometheus"]
    - source:
        # Nginx-ingress controller for proxying requests
        namespaces: ["ingress-nginx"]


