apiVersion: v1
kind: PersistentVolume
metadata:
  name: huggingface-pv-{{ .Values.user_id }}
spec:
  storageClassName: local-manual
  claimRef:
    namespace: user-{{ .Values.user_id }}
    name: huggingface-pvc-writer
  capacity:
    storage: 2000Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/fs
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: huggingface-pvc-writer
  namespace: user-{{ .Values.user_id }}
spec:
  storageClassName: local-manual
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2000Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: node-model-cache-pv-{{ .Values.user_id }}
spec:
  storageClassName: local-manual
  claimRef:
    namespace: user-{{ .Values.user_id }}
    name: node-model-cache-pvc
  capacity:
    storage: 2000Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /tmp
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: node-model-cache-pvc
  namespace: user-{{ .Values.user_id }}
spec:
  storageClassName: local-manual
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2000Gi
