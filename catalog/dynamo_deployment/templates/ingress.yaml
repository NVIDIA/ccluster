apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: acme-ca
    {{- if .Values.endpoint_certificate_authority }}
    nginx.ingress.kubernetes.io/auth-tls-secret: user-{{ .Values.user_id | int }}/{{ .Values.name }}-ca-secret
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    {{- end }}
    nginx.ingress.kubernetes.io/backend-protocol: {{ .Values.backend_protocol | default "HTTP" | quote }}
    # The default read timeout (response silence) is 60 seconds, but this causes issues with
    # non-streaming LLM completions that take longer than a minute. Setting to 15 minutes for now.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
    # This is used to increase the size of the request body from 1MB to 15MB.
    # Important on very large context models.
    nginx.ingress.kubernetes.io/proxy-body-size: "15m"
    {{- if ne (.Values.backend_protocol | default "HTTP") "GRPC" }}
    nginx.ingress.kubernetes.io/rewrite-target: /
    {{- end }}
    {{- if .Values.endpoint_bearer_token }}
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($http_authorization !~* "^Bearer {{ .Values.endpoint_bearer_token }}") {
        return 401;
      }
    {{- end}}
  generation: 1
  labels:
    platform.centml.ai/deployment-id: "{{ .Values.deployment_id | int }}"
  name: "{{ .Values.name }}"
  namespace: user-{{ .Values.user_id | int }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ default (printf "%s.user-%d.%s" .Values.name (.Values.user_id | int) .Values.domain) .Values.deployment_url }}
      http:
        paths:
          - backend:
              service:
                name: "{{ .Values.name }}-istio-friendly"
                port:
                  # The Dynamo operator Service always exposes 8000. It
                  # forwards to the Frontend container's named `http` port,
                  # which may use a different value.
                  number: 8000
            path: /
            pathType: ImplementationSpecific
  tls:
    - hosts:
        - {{ default (printf "%s.user-%d.%s" .Values.name (.Values.user_id | int) .Values.domain) .Values.deployment_url }}
      secretName: {{ .Values.name }}-tls
