# WARNING: This file is used via symlinking in derrivative charts (like cserve), so be careful when making changes.

# load up the (potentially) extra config files from _helpers.tmpl
{{- template "setExtraConfigFiles" . }}

apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Values.name }}
  namespace: user-{{ .Values.user_id }}
  annotations:
    {{- if .Values.plan_yaml }}
    platform.centml.ai/plan-yaml-hash: "{{ .Values.plan_yaml | sha256sum | trunc 8 }}"
    {{- end }}
    {{- if .Values.user_annotations }}
    {{- range $key, $value := .Values.user_annotations }}
    ccluster.nvidia.com/user-{{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- end }}
  {{- if .Values.user_annotations }}
  labels:
    {{- range $key, $value := .Values.user_annotations }}
    ccluster.nvidia.com/user-{{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  # Revision history isn't very useful for us. The configuration can change
  # so we always roll forward, even if we're "rolling back".
  revisionHistoryLimit: 1
  # Set progress deadline to 1 hr to give enough buffer time for allow pods to be scheduled
  progressDeadlineSeconds: 3600

  # Label selector for pods. Existing ReplicaSets whose pods are selected by
  # this will be the ones affected by this rollout. It must match the pod
  # template's labels.
  selector:
    matchLabels:
      platform.centml.ai/deployment-id: "{{ .Values.deployment_id }}"

  # if set to true, the rollout will be paused
  paused: {{ .Values.rollout_paused }}

  # Pod Template
  template:
    metadata:
      annotations:
        platform.centml.ai/deployment-id: "{{ .Values.deployment_id }}"
        platform.centml.ai/revision-number: "{{ .Values.revision_number }}"      
        platform.centml.ai/user-id: "{{ .Values.user_id }}"
        {{- if not .Values.enable_logging }}
        platform.centml.ai/log-exclude: "true"
        {{- end }}
        {{- if .Values.plan_yaml }}
        platform.centml.ai/plan-yaml-hash: "{{ .Values.plan_yaml | sha256sum | trunc 8 }}"
        {{- end }}
        {{- if .Values.user_annotations }}
        {{- range $key, $value := .Values.user_annotations }}
        ccluster.nvidia.com/user-{{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- end }}
        # this is needed to get the right metrics from istio/envoy for hpa
        proxy.istio.io/config: |-
          proxyStatsMatcher:
            inclusionRegexps:
            - ".*downstream_rq.*"
      labels:
        platform.centml.ai/deployment-id: "{{ .Values.deployment_id }}"
        platform.centml.ai/revision-number: "{{ .Values.revision_number }}"
        platform.centml.ai/custom_metrics: enabled
        {{- if .Values.user_annotations }}
        {{- range $key, $value := .Values.user_annotations }}
        ccluster.nvidia.com/user-{{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- end }}
    spec:
      {{- if .Values.scheduler_name }}
      schedulerName: {{ .Values.scheduler_name }}
      {{- end }}
      # Security is enforced at namespace level via PSA "baseline".
      securityContext:
        # Need to add extra group ids if we are using an AMD gpu as the group id is not consistent
        # More details on why this is need is found here: https://github.com/CentML/platform/issues/1917
        {{- if .Values.supplemental_group_ids }}
        supplementalGroups:
          {{- range .Values.supplemental_group_ids }}
          - {{ . }}
          {{- end }}
        {{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  {{- range $key, $value := .Values.node_affinity_labels }}
                  - key: {{ $key }}
                    operator: In
                    values:
                      - {{ $value }}
                  {{- end }}
      containers:
        - image: "{{ .Values.image_url }}"
          name: user-container
          {{- if .Values.command }}
          command: 
            {{- range .Values.command }}
            - {{ . }}
            {{- end }}
          {{- end }}
          {{- if .Values.command_args }}
          args:
            {{- range .Values.command_args }}
            - {{ . }}
            {{- end }}
          {{- end }}
          env:
            - name: OMP_NUM_THREADS
              value: "{{ default 8 (divf (.Values.resources.limits.cpu | atoi) 2 | ceil | int) }}"
            {{- if .Values.enable_node_model_cache }}
            - name: HF_HUB_CACHE
              value: /tmp
            {{- end }}
            {{- range $key, $value := .Values.env_vars }}
            - name: {{ $key }}
              value: "{{ $value }}"
            {{- end }}
            {{- if .Values.hf_token }}
            - name: HF_TOKEN
              value: "{{ .Values.hf_token }}"
            {{- end }}
          ports:
            - containerPort: {{ .Values.container_port }}              
              protocol: TCP
            # pods have a port named http-monitoring pointing to 15020 to get the right metrics from istio/envoy
            # this is already available and exposed to prometheus, but podmonitor needs it to be named
            - containerPort: 15020
              protocol: TCP
              name: http-monitoring
          readinessProbe:	
            successThreshold: 1	
            {{- if .Values.healthcheck }}
            httpGet:
              path: {{ .Values.healthcheck }}
              port: {{ .Values.container_port }}
            {{- else }}
            # TCP socket check for gRPC or when no healthcheck path is specified
            tcpSocket:	
              port: {{ .Values.container_port }}
            {{- end }}
          resources:
            limits:
              cpu: "{{ .Values.resources.limits.cpu}}"
              memory: "{{ .Values.resources.limits.memory}}"
              {{ .Values.resources.limits.accelerator_key }}: {{ .Values.resources.limits.accelerator_count }}
            requests:
              cpu: "{{ .Values.resources.requests.cpu }}"
              memory: "{{ .Values.resources.requests.memory }}"
              {{ .Values.resources.requests.accelerator_key }}: {{ .Values.resources.requests.accelerator_count }}
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
            # See _helpers.tpl for instructions on how to define extraConfigFiles.
            # subPath/mountPath are quoted: a filename like "true" or "123" passes the
            # API regex but would otherwise render as a YAML bool/number and be
            # rejected by the k8s schema (subPath must be a string).
            {{- range .ExtraConfigFiles }}
            - name: {{ .configMapName }}
              readOnly: {{ .volumeMountReadOnly }}
              subPath: {{ .volumeMountSubPath | quote }}
              mountPath: {{ .volumeMountMountPath | quote }}
            {{- end }}
            {{- if .Values.enable_node_model_cache }}
            - name: model-cache
              mountPath: /tmp
            {{- end }}
      enableServiceLinks: false
      imagePullSecrets:
        - name: ecr-image-pull
        {{- if .Values.image_pull_secret }}
        - name: {{ .Values.name }}-image-pull-secret
        {{- end }}
      tolerations:
        - effect: NoSchedule
          key: dedicated_compute
          operator: Equal
          value: "true"
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ default "512Mi" .Values.dev_shm_size }}
        # See _helpers.tpl for instructions on how to define extraConfigFiles
        {{- range .ExtraConfigFiles }}
        - name: {{ .configMapName }}
          configMap:
            name: {{ .configMapName }}
        {{- end }}
        {{- if .Values.enable_node_model_cache }}
        - name: model-cache
          persistentVolumeClaim:
            claimName: node-model-cache-pvc
        {{- end }}
  strategy:
    # Adding `trafficRouting` (e.g. istio) splits traffic across weighted
    # clusters, which breaks session_affinity — Envoy picks a cluster
    # randomly per request before applying hash (envoyproxy/envoy#8167).
    # Plain `steps: [{setWeight}]` without trafficRouting only adjusts
    # ReplicaSet pod counts and is safe.
    canary:

      # MaxSurge The maximum number of pods that can be scheduled above the original number of
      # pods.
      # Value can be an absolute number (ex: 5) or a percentage of total pods at
      # the start of the update (ex: 10%). This can not be 0 if MaxUnavailable is 0.
      # Absolute number is calculated from percentage by rounding up.
      # By default, a value of 25% is used.
      # Example: when this is set to 30%, the new RC can be scaled up by 30%
      # immediately when the rolling update starts. Once old pods have been killed,
      # new RC can be scaled up further, ensuring that total number of pods running
      # at any time during the update is at most 130% of original pods.      maxSurge: 1
      # See: https://github.com/argoproj/argo-rollouts/blob/master/pkg/apis/rollouts/v1alpha1/types.go
      # Note: values must be unquoted integers so argo-rollouts treats them as absolute pod counts,
      # not percentages (quoted strings are interpreted as percentages by argo-rollouts).
      maxSurge: {{ .Values.rollout_strategy.max_surge }}

  # MaxUnavailable The maximum number of pods that can be unavailable during the update.
      # Value can be an absolute number (ex: 5) or a percentage of total pods at the start of update (ex: 10%).
      # Absolute number is calculated from percentage by rounding down.
      # This can not be 0 if MaxSurge is 0.
      # By default, a fixed value of 25% is used.
      # Example: when this is set to 30%, the old RC can be scaled down by 30%
      # immediately when the rolling update starts. Once new pods are ready, old RC
      # can be scaled down further, followed by scaling up the new RC, ensuring
      # that at least 70% of original number of pods are available at all times
      # during the update.
      #
      # See: https://github.com/argoproj/argo-rollouts/blob/master/pkg/apis/rollouts/v1alpha1/types.go
      # Note: values must be unquoted integers so argo-rollouts treats them as absolute pod counts,
      # not percentages (quoted strings are interpreted as percentages by argo-rollouts).
      maxUnavailable: {{ .Values.rollout_strategy.max_unavailable }}
