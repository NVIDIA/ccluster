# Per-deployment user-application metrics scrape (vs. the sidecar/system
# scrape in service_monitor.yaml). sampleLimit below caps cardinality so a
# runaway high-cardinality user metric cannot blow up the cluster
# Prometheus / AMP workspace budget.
#
# helm.values serializes an absent metrics bundle as `metrics: null`;
# default dict keeps the field lookups below safe in that case.
{{- $m := .Values.metrics | default dict }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-app-metrics
  namespace: user-{{ .Values.user_id | int }}
  labels:
    platform.centml.ai/sm: custom-metrics-{{ .Values.deployment_id | int }}
spec:
  selector:
    platform.centml.ai/deployment-id: "{{ .Values.deployment_id | int }}"
  ports:
    - name: metrics
      # 18000 mirrors the cserve namespace-shared scraper convention
      # (namespace_base/templates/service-monitor.yaml).
      port: 18000
      targetPort: {{ $m.port | default .Values.container_port }}
      protocol: TCP
      # Deliberately NO appProtocol. targetPort defaults to container_port, so
      # this Service shares the serving workload port. Declaring appProtocol:http
      # here poisons Istio's protocol resolution for that port — on affected
      # clusters the gRPC serving port is treated as HTTP and gRPC streams are
      # reset. Without it Istio sniffs (http/1.1,h2c), the scrape still works
      # over HTTP, and a metrics misconfiguration degrades to a silent scrape
      # failure instead of breaking serving. The ServiceMonitor still pins the
      # scrape transport (scheme: https, enableHttp2: false).
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.name }}-app-metrics
  namespace: user-{{ .Values.user_id | int }}
spec:
  selector:
    matchLabels:
      platform.centml.ai/sm: custom-metrics-{{ .Values.deployment_id | int }}
  endpoints:
    - port: metrics
      path: {{ $m.path | default "/metrics" | quote }}
      interval: 15s
      scheme: https
      # Force HTTP/1.1 to dodge a known transport-layer fragility specific to
      # Prometheus scraping through an Istio mTLS sidecar over HTTP/2. The
      # public record (prometheus/prometheus#10213, #9068; istio/istio#36992)
      # shows reused Go net/http2 scrape connections breaking across Envoy
      # connection-drain events — the application stays healthy, fresh curl
      # over the same mTLS certs returns 200, but Prometheus surfaces
      # `unexpected EOF` / `http2: failed reading the frame payload`. Envoy
      # logs in #36992 show `goaway code=0` and `drain closing connection`
      # during the failing scrape window.
      #
      # The drain events themselves are real Istio behaviour on LDS pushes;
      # Istiod xDS streams are also intentionally cycled (~every 30 min,
      # documented). What is NOT a settled property of the public record is
      # whether the 30-min reconnect by itself rebuilds the listener — it
      # only does when an actual config diff exists (e.g. istio#54672:
      # accessLog entry ordering churn produced spurious listener updates
      # at roughly that cadence). Treat the cadence as a likely amplifier,
      # not a guaranteed trigger.
      #
      # Disabling HTTP/2 puts the scrape on Go's net/http (HTTP/1.1)
      # transport, which has no h2 framer and no GOAWAY semantics: a
      # half-closed conn appears as plain EOF and the next scrape opens a
      # new one. This is the canonical Prometheus-side mitigation
      # (prometheus/prometheus#10213, prometheus-operator#4836, promoted
      # from PROMETHEUS_COMMON_DISABLE_HTTP2 in prometheus/common v0.30.0
      # to a per-scrape `enable_http2` field in Prometheus 2.35).
      #
      # Verified on dev (Istio 1.24.6 / Envoy 1.32.6): with enableHttp2 set
      # to true the vLLM scrape target stays `health=down` with the framing
      # error; flipped to false and the same pod's vllm:* metrics start
      # ingesting into AMP within one scrape interval.
      enableHttp2: false
      tlsConfig:
        insecureSkipVerify: true
        caFile: /etc/istio-output-certs/root-cert.pem
        certFile: /etc/istio-output-certs/cert-chain.pem
        keyFile: /etc/istio-output-certs/key.pem
      metricRelabelings:
        - targetLabel: deployment_id
          replacement: "{{ .Values.deployment_id | int }}"
          action: replace
  sampleLimit: 2000
