apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-envoy-metrics
  namespace: user-{{ .Values.user_id | int }}
  labels:
      platform.centml.ai/deployment-id: "{{ .Values.deployment_id | int }}"
spec:
  selector:
      platform.centml.ai/deployment-id: "{{ .Values.deployment_id | int }}"
  ports:
    - name: envoy-prom
      port: 15090
      targetPort: 15090
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.name }}-envoy-metrics
  namespace: user-{{ .Values.user_id | int }}
spec:
  selector:
    matchLabels:
      platform.centml.ai/deployment-id: "{{ .Values.deployment_id | int }}"
  endpoints:
    - port: envoy-prom
      path: /stats/prometheus
      interval: 15s
      metricRelabelings:
        - targetLabel: deployment_id
          replacement: "{{ .Values.deployment_id | int }}"
          action: replace
