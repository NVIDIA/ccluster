{{- template "setExtraConfigFiles" . }}
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
    platform.centml.ai/deployment-id: "{{ .Values.deployment_id }}"
    platform.centml.ai/user-id: "{{ .Values.user_id }}"
  labels:
    platform.centml.ai/deployment-id: "{{ .Values.deployment_id }}"
    platform.centml.ai/workload_type: job
  name: "{{ .Values.name }}"
  namespace: user-{{ .Values.user_id }}
spec:
  backoffLimit: {{ .Values.backoff_limit }}
  ttlSecondsAfterFinished: 7200
  {{- if .Values.active_deadline_seconds }}
  activeDeadlineSeconds: {{ .Values.active_deadline_seconds }}
  {{- end }}
  {{- if .Values.completions }}
  completions: {{ .Values.completions }}
  {{- end }}
  {{- if .Values.parallelism }}
  parallelism: {{ .Values.parallelism }}
  {{- end }}
  completionMode: Indexed
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
        platform.centml.ai/deployment-id: "{{ .Values.deployment_id }}"
        platform.centml.ai/revision-number: "1"
        platform.centml.ai/user-id: "{{ .Values.user_id }}"
        {{- if not .Values.enable_logging }}
        platform.centml.ai/log-exclude: "true"
        {{- end }}
        {{- if .Values.user_annotations }}
        {{- range $key, $value := .Values.user_annotations }}
        ccluster.nvidia.com/user-{{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- end }}
      labels:
        platform.centml.ai/deployment-id: "{{ .Values.deployment_id }}"
        platform.centml.ai/revision-number: "1"
        platform.centml.ai/workload_type: job
        {{- if .Values.user_annotations }}
        {{- range $key, $value := .Values.user_annotations }}
        ccluster.nvidia.com/user-{{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- end }}
    spec:
      {{- if .Values.scheduler_name }}
      schedulerName: {{ .Values.scheduler_name }}
      {{- end }}
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                {{- range $key, $value := .Values.node_affinity_labels }}
                - key: "{{ $key }}"
                  operator: In
                  values:
                    - {{ $value | quote }}
                {{- end }}
      containers:
        - name: user-container
          image: "{{ .Values.image_url }}"
          {{- if .Values.command }}
          command:
            {{- range .Values.command }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          {{- if .Values.args }}
          args:
            {{- range .Values.args }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          env:
            - name: "JOB_COMPLETIONS"
              value: "{{ .Values.completions }}"
            {{- range $key, $value := .Values.env_vars }}
            - name: "{{ $key }}"
              value: "{{ $value }}"
            {{- end }}
          resources:
            limits:
              cpu: "{{ .Values.resources.limits.cpu }}"
              memory: "{{ .Values.resources.limits.memory }}"
              {{ .Values.resources.limits.accelerator_key }}: {{ .Values.resources.limits.accelerator_count }}
            requests:
              cpu: "{{ .Values.resources.requests.cpu }}"
              memory: "{{ .Values.resources.requests.memory }}"
              {{ .Values.resources.requests.accelerator_key }}: {{ .Values.resources.requests.accelerator_count }}
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
            # See _helpers.tpl for instructions on how to define extraConfigFiles.
            # subPath/mountPath are quoted: a filename like "true" or "123" passes the
            # API regex but would otherwise render as a YAML bool/number and be
            # rejected by the k8s Job schema (subPath must be a string).
            {{- range .ExtraConfigFiles }}
            - name: {{ .configMapName }}
              readOnly: {{ .volumeMountReadOnly }}
              subPath: {{ .volumeMountSubPath | quote }}
              mountPath: {{ .volumeMountMountPath | quote }}
            {{- end }}
      imagePullSecrets:
        - name: ecr-image-pull
        {{- if .Values.image_pull_secret }}
        - name: {{ .Values.name }}-image-pull-secret
        {{- end }}
      tolerations:
        - effect: NoSchedule
          key: dedicated_compute
          operator: Equal
          value: "true"
      volumes:
        - emptyDir:
            medium: Memory
            sizeLimit: {{ default "512Mi" .Values.dev_shm_size }}
          name: dshm
        # See _helpers.tpl for instructions on how to define extraConfigFiles
        {{- range .ExtraConfigFiles }}
        - name: {{ .configMapName }}
          configMap:
            name: {{ .configMapName }}
        {{- end }}
