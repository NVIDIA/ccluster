{{- if .Values.config_file }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: job-config-{{ .Values.deployment_id | int }}
  namespace: user-{{ .Values.user_id | int }}
# binaryData carries the base64 payload k8s decodes verbatim into the file, so the content
# survives byte-for-byte (trailing newlines included); a filename like "true"/"123" stays a
# string map key.
binaryData:
  {{ .Values.config_file.filename | quote }}: {{ .Values.config_file.content_base64 | quote }}
{{- end }}
