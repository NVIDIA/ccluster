apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: cert-manager
spec:
  spiffeIDTemplate: "spiffe://{{ .Values.global.cluster.domain }}/ns/cert-manager/sa/cert-manager"
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: cert-manager
