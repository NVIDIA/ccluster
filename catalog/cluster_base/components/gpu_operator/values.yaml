gpu-operator:
  nfd:
    enabled: true
  cdi:
    enabled: true
    default: true
  mig:
    strategy: mixed
  migManager:
    config:
      name: custom-mig-parted-config
  # On k3d/kind, the "node" is a Docker container that shares the host
  # kernel — the in-cluster NVIDIA driver DaemonSet can't load/unload
  # modules and races with the host's already-loaded driver. For these
  # setups, the host must have the NVIDIA driver + nvidia-container-
  # toolkit installed, and we tell gpu-operator to skip its own driver
  # install and use the host's. On bare-metal / EKS / GKE / etc. flip
  # both back to enabled: true.
  driver:
    enabled: false
  toolkit:
    enabled: false
  # Workaround for gpu-operator v25.3.4 chart bug: when
  # validator.plugin.env is the empty default ([]), the ClusterPolicy
  # template renders `plugin:` with no body, which YAML parses as null
  # and the CRD schema rejects with
  # `spec.validator.plugin in body must be of type object`. Setting at
  # least one env var forces the template's inner block to render so
  # `plugin` is a valid object.
  validator:
    plugin:
      env:
        - name: WITH_WORKLOAD
          value: "false"
