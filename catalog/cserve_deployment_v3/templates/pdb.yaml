# WARNING: This file is used via symlinking in derivative charts (like cserve), so be careful when making changes.

{{- if gt (.Values.hpa.max_replicas | int) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.name }}-pdb
  namespace: user-{{ .Values.user_id }}
  labels:
    app: {{ .Values.name }}
spec:
  # Disruption budget based on replica count:
  # - 2 replicas: allow 50% disruption (maxUnavailable: 50%)
  # - 3+ replicas: allow 30% disruption (maxUnavailable: 30%)
  {{- if eq (.Values.hpa.min_replicas | int) 2 }}
  maxUnavailable: 50%
  {{- else if gt (.Values.hpa.min_replicas | int) 2 }}
  maxUnavailable: 30%
  {{- else }}
  minAvailable: 1
  {{- end }}
  selector:
    matchLabels:
      platform.centml.ai/deployment-id: "{{ .Values.deployment_id }}"
{{- end }}