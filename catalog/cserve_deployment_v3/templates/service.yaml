# Unfortunately, we need to use external name services like this for istio since nginx will use
# the raw pod ips and the istio mesh isn't ip aware like this (it's service aware).
apiVersion: v1
kind: Service
metadata:
    labels:
        platform.centml.ai/deployment-id: "{{ .Values.deployment_id }}"
    name: "{{ .Values.name }}"
    namespace: user-{{ .Values.user_id }}
spec:
    type: ClusterIP
    selector:
        platform.centml.ai/deployment-id: "{{ .Values.deployment_id }}"
    ports:
        - name: container-port
          port: {{ .Values.container_port }}
          targetPort: {{ .Values.container_port }}
---
apiVersion: v1
kind: Service
metadata:
    labels:
        platform.centml.ai/deployment_id: "{{ .Values.deployment_id }}"
    name: "{{ .Values.name }}-istio-friendly"
    namespace: user-{{ .Values.user_id }}
spec:
    type: ExternalName
    externalName: "{{ .Values.name }}.user-{{ .Values.user_id }}.svc.cluster.local"
