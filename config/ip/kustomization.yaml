# Deploy overlay for ccluster-ip-operator, which runs in an infra-plane cluster.
# Built by `make build-installer-ip` into dist/install-ip.yaml, the input
# `make helm-generate` turns into charts/ip/chart.
#
# The infra-plane cluster gets no CRDs: this operator owns no kinds yet. Add
# ../crd (or a subset of it) here once it does.

# Adds namespace to all resources.
namespace: ccluster-ip-system

# Value of this field is prepended to the names of all resources.
# Note that it should also match with the prefix (text before '-') of the
# namespace field above.
namePrefix: ccluster-ip-

resources:
- ../base
- rbac
# [PROMETHEUS] To enable prometheus monitor, uncomment all sections with 'PROMETHEUS'.
#- ../prometheus
# [NETWORK POLICY] Protect the /metrics endpoint with NetworkPolicy.
#- ../network-policy

# The image name is fixed here and nothing rewrites it. No tag is set: the deployed
# image is manager.image in the chart's values.yaml, stamped by `make helm-package-ip`.
images:
- name: controller
  newName: ghcr.io/nvidia/ccluster-ip-operator
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
