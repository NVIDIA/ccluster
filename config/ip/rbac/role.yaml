---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ccluster.nvidia.com
  resources:
  - cclclusterconfigs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ccluster.nvidia.com
  resources:
  - cclclusterconfigs/status
  verbs:
  - get
  - patch
  - update
