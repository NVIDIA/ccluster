# Deploys two catalog components onto the cluster registered by
# v1alpha1_cclinfraplane.yaml, in order. Apply that sample first: this one stays
# Validated=False until the CCLInfraPlane it names reports Available.
#
# The order of components is the rollout order. The operator does not create the
# Application for ccluster-local-base-keda at all until ccluster-local-base-argo-rollouts
# reports Healthy and Synced, so the two never sync concurrently. There is no timeout on
# that wait; status.conditions[Progressing] names whichever component is holding things up.
apiVersion: ccluster.nvidia.com/v1alpha1
kind: CCLDeployment
metadata:
  labels:
    app.kubernetes.io/name: ccluster
    app.kubernetes.io/managed-by: kustomize
  name: ccluster-local-base
spec:
  components:
    # Chart paths are relative to the root of the catalog repository named by the
    # operator's --catalog-repo-url, at --catalog-revision. Argo CD's repo-server clones
    # it, so the revision has to have been pushed.
    - name: argo-rollouts
      infraPlaneRef:
        name: ccluster-local
      chart: catalogs/cluster_base/argo_rollouts
      namespace: argo-rollouts

    # values is handed to Helm untouched. Its shape is the chart's business, not the
    # operator's — here the keys are nested under the upstream chart's alias because
    # catalogs/cluster_base/keda wraps it as a dependency.
    - name: keda
      infraPlaneRef:
        name: ccluster-local
      chart: catalogs/cluster_base/keda
      namespace: keda
      values:
        keda:
          operator:
            replicaCount: 1
