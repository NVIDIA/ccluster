# This rule is not used by the project ccluster itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to ccluster.nvidia.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and read-only operations.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ccluster
    app.kubernetes.io/managed-by: kustomize
  name: cclcomponentset-viewer-role
rules:
- apiGroups:
  - ccluster.nvidia.com
  resources:
  - cclcomponentsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ccluster.nvidia.com
  resources:
  - cclcomponentsets/status
  verbs:
  - get
