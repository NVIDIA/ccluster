# This rule is not used by the project ccluster itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, edit and delete resources within the ccluster.nvidia.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ccluster
    app.kubernetes.io/managed-by: kustomize
  name: ccldeployment-editor-role
rules:
- apiGroups:
  - ccluster.nvidia.com
  resources:
  - ccldeployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ccluster.nvidia.com
  resources:
  - ccldeployments/status
  verbs:
  - get
