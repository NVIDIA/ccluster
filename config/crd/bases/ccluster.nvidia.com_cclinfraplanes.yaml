---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: cclinfraplanes.ccluster.nvidia.com
spec:
  group: ccluster.nvidia.com
  names:
    kind: CCLInfraPlane
    listKind: CCLInfraPlaneList
    plural: cclinfraplanes
    singular: cclinfraplane
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.domain
      name: Domain
      type: string
    - jsonPath: .status.conditions[?(@.type=="Available")].status
      name: Available
      type: string
    - jsonPath: .status.conditions[?(@.type=="ClusterConfigApplied")].status
      name: ClusterConfig
      type: string
    - jsonPath: .status.clusterConfig.conditions[?(@.type=="Verified")].status
      name: Verified
      type: string
    - jsonPath: .status.conditions[?(@.type=="DNSReady")].status
      name: DNS
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CCLInfraPlane is the Schema for the cclinfraplanes API.

          It registers an infra-plane cluster with the control plane. The cluster's DNS domain is
          "<name>.<namespace>.<base domain>", the base domain being the control-plane operator's
          --base-domain, so the name must be a DNS label. The operator writes that domain to the
          cluster's CCLClusterConfig and points "*.<lb>.<domain>" at each of the cluster's
          LoadBalancers labelled ccluster.nvidia.com/loadbalancer: <lb>, such as
          "*.nginx.<domain>" at its ingress. status.domain shows the domain as soon as the
          operator has reconciled the plane, and status.clusterConfig.domain once the
          infra-plane operator has verified the cluster against it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of CCLInfraPlane
            properties:
              clusterCredentialsRef:
                description: |-
                  clusterCredentialsRef references a Secret in the same namespace as this
                  CCLInfraPlane that holds the credentials for the infra-plane cluster's API
                  server.

                  Its data is copied verbatim into a Secret in the Argo CD namespace, named
                  after this CCLInfraPlane and labelled "argocd.argoproj.io/secret-type:
                  cluster". The operator does not interpret the data, so the referenced Secret
                  must already carry Argo CD's cluster-secret keys - "server" and "config".

                  The exception is "name", which Argo CD displays as the cluster name: the
                  operator always sets it to this CCLInfraPlane's name, overwriting whatever the
                  referenced Secret holds. See
                  https://argo-cd.readthedocs.io/en/stable/operator-manual/declarative-setup/#clusters
                properties:
                  name:
                    description: name is the name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                title: LocalObjectReference
                type: object
            required:
            - clusterCredentialsRef
            title: CCLInfraPlaneSpec
            type: object
          status:
            description: status defines the observed state of CCLInfraPlane
            properties:
              clusterConfig:
                description: |-
                  clusterConfig is the status of the CCLClusterConfig singleton on the infra-plane
                  cluster, copied verbatim whenever it changes there. It is what the infra-plane
                  operator reports about the cluster; ClusterConfigApplied says whether the copy is
                  current. Its conditions and observedGeneration are the infra-plane operator's, and
                  refer to the CCLClusterConfig, not to this CCLInfraPlane. Its domain is the
                  plane's domain once the infra-plane operator has verified the cluster against it;
                  see domain.
                properties:
                  conditions:
                    description: |-
                      conditions represent the current state of the infra-plane cluster's
                      CCLClusterConfig.

                      Condition types reported by the infra-plane operator:
                        - "Verified": every catalogs/cluster_base component is installed in this
                          cluster and configured for it, except an optional one, which may be absent.
                          When False, the message names the charts that failed verification.

                      The status of each condition is one of True, False, or Unknown.
                    items:
                      description: Condition contains details for one aspect of the
                        current state of this API Resource.
                      properties:
                        lastTransitionTime:
                          description: |-
                            lastTransitionTime is the last time the condition transitioned from one status to another.
                            This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                          format: date-time
                          type: string
                        message:
                          description: |-
                            message is a human readable message indicating details about the transition.
                            This may be an empty string.
                          maxLength: 32768
                          type: string
                        observedGeneration:
                          description: |-
                            observedGeneration represents the .metadata.generation that the condition was set based upon.
                            For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                            with respect to the current state of the instance.
                          format: int64
                          minimum: 0
                          type: integer
                        reason:
                          description: |-
                            reason contains a programmatic identifier indicating the reason for the condition's last transition.
                            Producers of specific condition types may define expected values and meanings for this field,
                            and whether the values are considered a guaranteed API.
                            The value should be a CamelCase string.
                            This field may not be empty.
                          maxLength: 1024
                          minLength: 1
                          pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                          type: string
                        status:
                          description: status of the condition, one of True, False,
                            Unknown.
                          enum:
                          - "True"
                          - "False"
                          - Unknown
                          type: string
                        type:
                          description: type of condition in CamelCase or in foo.example.com/CamelCase.
                          maxLength: 316
                          pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                          type: string
                      required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - type
                    x-kubernetes-list-type: map
                  domain:
                    description: |-
                      domain is the spec.domain the infra-plane operator last verified the cluster
                      against, in the same pass as observedGeneration. The control-plane operator copies
                      it, with the rest of this status, into the CCLInfraPlane that registers the cluster.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)+$
                    type: string
                  loadBalancers:
                    description: |-
                      loadBalancers are the cluster's LoadBalancer Services labelled
                      ccluster.nvidia.com/loadbalancer, one per label value, as the infra-plane operator
                      last observed them. A value carried by more than one Service is left out and
                      reported in the Verified condition.
                    items:
                      description: |-
                        LoadBalancerStatus is the address of a LoadBalancer Service labelled
                        ccluster.nvidia.com/loadbalancer, as the Service reports it. ip and hostname are both
                        empty until the cloud provider assigns one. Neither the schema nor the infra-plane
                        operator checks the address: the control-plane operator does, when it publishes the
                        LoadBalancer's DNS record, and reports one it cannot use in its DNSReady condition.
                      properties:
                        hostname:
                          description: |-
                            hostname is the LoadBalancer's DNS name, set by cloud providers whose load
                            balancers are addressed by name rather than by IP: the first hostname the Service
                            reports.
                          maxLength: 253
                          type: string
                        ip:
                          description: 'ip is the LoadBalancer''s IP address: the
                            first IP the Service reports.'
                          maxLength: 45
                          type: string
                        name:
                          description: name is the Service's ccluster.nvidia.com/loadbalancer
                            label value.
                          maxLength: 63
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  observedGeneration:
                    description: |-
                      observedGeneration is the CCLClusterConfig's .metadata.generation the conditions
                      were computed from.
                    format: int64
                    type: integer
                title: CCLClusterConfigStatus
                type: object
              conditions:
                description: |-
                  conditions represent the current state of the CCLInfraPlane resource.

                  Condition types reported by the control-plane operator:
                    - "Available": the namespace's Argo CD AppProject exists and the cluster
                      Secret has been mirrored into the Argo CD namespace.
                    - "ClusterConfigApplied": the CCLClusterConfig singleton on the infra-plane
                      cluster carries this CCLInfraPlane's domain.
                    - "DNSReady": external-dns has read the current records pointing
                      "*.<lb>.<domain>" at each of the cluster's LoadBalancers labelled
                      ccluster.nvidia.com/loadbalancer: <lb>, and every label value is a DNS label.
                      external-dns marks the records read before it writes them, so True does not
                      mean they were published: the provider may reject them, or external-dns may
                      skip them.

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              domain:
                description: |-
                  domain is the cluster's DNS domain, "<name>.<namespace>.<base domain>", derived by
                  the control-plane operator from its --base-domain and written on every status
                  update, whether or not the cluster is reachable. It is the domain the operator
                  writes to the cluster's CCLClusterConfig and publishes "*.<lb>.<domain>" records
                  under. clusterConfig.domain is the domain the infra-plane operator last verified
                  the cluster against; the two differ until it has verified the current one.
                type: string
              observedGeneration:
                description: observedGeneration is the .metadata.generation the conditions
                  were computed from.
                format: int64
                type: integer
            title: CCLInfraPlaneStatus
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'name must be a DNS label: at most 63 lowercase letters, digits
            and ''-'', starting and ending with a letter or digit'
          rule: size(self.metadata.name) <= 63 && self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    served: true
    storage: true
    subresources:
      status: {}
