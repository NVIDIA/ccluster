# Every CRD, for `make install` in a host-manager loop. Each deploy overlay includes
# this and deletes the kinds the other operator serves: kustomize will not load a file
# from outside the kustomization's own directory, so a per-operator list cannot live in
# a subdirectory here.
resources:
- bases/ccluster.nvidia.com_cclclusterconfigs.yaml
- bases/ccluster.nvidia.com_cclcomponentsets.yaml
- bases/ccluster.nvidia.com_cclinfraplanes.yaml
# +kubebuilder:scaffold:crdkustomizeresource

patches:
# [WEBHOOK] To enable webhook, uncomment all the sections with [WEBHOOK] prefix.
# patches here are for enabling the conversion webhook for each CRD
# +kubebuilder:scaffold:crdkustomizewebhookpatch

# [WEBHOOK] To enable webhook, uncomment the following section
# the following config is for teaching kustomize how to do kustomization for CRDs.
#configurations:
#- kustomizeconfig.yaml
