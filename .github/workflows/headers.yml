#
# Every hand-written source file carries the SPDX license header. No path filter: a
# new file of any kind can be missing it.
name: License Headers

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  headers:
    name: Check SPDX headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check SPDX headers
        run: make check-headers
