name: E2E Tests

on:
  pull_request:
    # `labeled` so adding the release label to an open PR re-runs it as the full tier.
    types: [opened, synchronize, reopened, labeled]
    # Only when something the suite depends on changes; docs, workflow-only and most
    # catalog PRs skip it. Keep in sync with docs/build-and-release.md "CI checks".
    # VERSION is here so a release PR, which changes little else, runs the full tier.
    paths:
      - 'VERSION'
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'Dockerfile'
      - '.dockerignore'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'config/**'
      - 'charts/**'
      - 'test/**'
      # The suite registers the separate infra-plane cluster with the ccluster CLI.
      - 'python/**'
      # The suite installs this chart and asserts the APIService it serves.
      - 'catalogs/cluster_base/metrics_server/**'
      - '.github/workflows/test-e2e.yml'

jobs:
  test-e2e:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      # The suite registers its infra-plane cluster with the ccluster CLI from python/.
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # The suite builds both operator images; nothing else builds the launcher image
      # before main.yml does after merge, so a broken Dockerfile stage would land on main.
      - name: Build the compute-ssh image
        run: make docker-build-compute-ssh

      # A PR carrying the `release` label runs the full tier: real Argo CD, real rollout,
      # ordered release and teardown. Everything else runs the quick tier. Argo CD clones
      # the catalog from this (internal) repository, so it needs the workflow token.
      - name: Running Test e2e
        env:
          E2E_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'release') && 'true' || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make test-e2e E2E_FULL="$E2E_FULL"
