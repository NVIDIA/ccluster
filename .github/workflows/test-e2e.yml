name: E2E Tests

on:
  pull_request:
    # Only when something the suite depends on changes; docs, catalog and workflow-only
    # PRs skip it. Keep in sync with AGENTS.md "Pull requests".
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'Dockerfile'
      - 'config/**'
      - 'charts/**'
      - 'test/**'
      - '.github/workflows/test-e2e.yml'

jobs:
  test-e2e:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # bin/ holds the downloaded tools (controller-gen, kustomize, setup-envtest and its
      # Kubernetes assets, golangci-lint, yq). Building them from source costs a minute
      # or more per job, so they are cached on the Makefile (tool versions) and go.sum
      # (envtest's version derives from controller-runtime's).
      - uses: actions/cache@v4
        with:
          path: bin
          key: bin-${{ runner.os }}-${{ hashFiles('Makefile', 'go.sum') }}

      # The suite builds the manager image with `make docker-build-cp`, a plain
      # `docker build`. Give it the same two caches main.yml uses (see AGENTS.md "Image
      # builds"): `install: true` routes `docker build` through a buildx builder so the
      # type=gha layer cache works, and buildkit-cache-dance carries the Go cache mounts
      # across runs. --load puts the result in the local image store for `kind load`.
      - uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          install: true
      # The buildx CLI's type=gha cache needs the Actions cache endpoint and token, which the
      # runner hands only to JavaScript actions. Export them the way
      # crazy-max/ghaction-github-runtime does; that action is not on the org's allow-list.
      - uses: actions/github-script@v7
        with:
          script: |
            for (const v of ["ACTIONS_CACHE_URL", "ACTIONS_RESULTS_URL", "ACTIONS_RUNTIME_TOKEN", "ACTIONS_RUNTIME_URL", "ACTIONS_CACHE_SERVICE_V2"]) {
              if (process.env[v]) core.exportVariable(v, process.env[v]);
            }
      - uses: actions/cache@v4
        id: go-cache
        with:
          path: |
            go-build-cache
            go-mod-cache
          key: go-buildkit-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-buildkit-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-buildkit-${{ runner.os }}-
      # Pinned to the SHA the org's Actions allow-list admits (v3.3.0).
      - uses: reproducible-containers/buildkit-cache-dance@5b81f4d29dc8397a7d341dba3aeecc7ec54d6361
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "go-build-cache": "/root/.cache/go-build",
              "go-mod-cache": "/go/pkg/mod"
            }
          skip-extraction: ${{ steps.go-cache.outputs.cache-hit }}

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        env:
          DOCKER_BUILD_ARGS: --load --cache-from type=gha,scope=e2e --cache-to type=gha,scope=e2e,mode=max
        run: make test-e2e
