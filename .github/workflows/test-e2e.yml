name: E2E Tests

on:
  pull_request:
    # `labeled` so adding the release label to an open PR re-runs it as the full tier.
    types: [opened, synchronize, reopened, labeled]
    # Only when something the suite depends on changes; docs, workflow-only and most
    # catalog PRs skip it. Keep in sync with docs/build-and-release.md "CI checks".
    # VERSION is here so a release PR, which changes little else, runs the full tier.
    paths:
      - 'VERSION'
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'Dockerfile'
      - '.dockerignore'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'config/**'
      - 'charts/**'
      - 'test/**'
      - '.github/workflows/test-e2e.yml'

jobs:
  test-e2e:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # kind and its node image are pinned in the Makefile, which builds kind into bin/,
      # so this run and a local `make test-e2e` use the same ones.
      #
      # Every kind node shares the runner's per-user inotify limits. The runner's default
      # instance limit runs out once both clusters carry the full tier's workloads, and
      # istio-cni-node then crash-loops with "watcher create: too many open files". These
      # are the values kind's known-issues page recommends; a higher limit is kept.
      # make check-kind-host, which test-e2e runs first, fails the full tier on a host still
      # below them and warns on the quick tier, which fits under the runner's defaults.
      - name: Raise inotify limits for kind
        run: |
          for setting in fs.inotify.max_user_instances=512 fs.inotify.max_user_watches=524288; do
            key="${setting%=*}" want="${setting#*=}"
            have="$(sysctl -n "$key")"
            echo "$key: $have"
            if [ "$have" -lt "$want" ]; then sudo sysctl -w "$key=$want"; fi
          done

      # The suite builds both operator images; nothing else builds the launcher image
      # before main.yml does after merge, so a broken Dockerfile stage would land on main.
      - name: Build the compute-ssh image
        run: make docker-build-compute-ssh

      # A PR carrying the `release` label runs the full tier: real Argo CD, real rollout,
      # ordered release and teardown. Everything else runs the quick tier. Argo CD clones
      # the catalog from this (internal) repository, so it needs the workflow token.
      - name: Running Test e2e
        env:
          E2E_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'release') && 'true' || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make test-e2e E2E_FULL="$E2E_FULL"
