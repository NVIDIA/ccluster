# DCO (Developer Certificate of Origin) check.
# Replacement for the DCO GitHub App: fails a PR if any non-merge commit is
# missing a valid `Signed-off-by` trailer matching its author.
# Self-contained (no third-party actions). See CONTRIBUTING.md for the policy.
name: DCO

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: Check Signed-off-by
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so we can inspect every PR commit

      - name: Verify DCO sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          fail=0
          commits="$(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")"
          if [ -z "${commits}" ]; then
            echo "No non-merge commits to check."
            exit 0
          fi
          for sha in ${commits}; do
            short="$(git rev-parse --short "${sha}")"
            subject="$(git show -s --format='%s' "${sha}")"
            name="$(git show -s --format='%an' "${sha}")"
            email="$(git show -s --format='%ae' "${sha}")"
            body="$(git show -s --format='%B' "${sha}")"
            expected="Signed-off-by: ${name} <${email}>"
            if printf '%s\n' "${body}" | grep -qxF "${expected}"; then
              echo "PASS ${short} ${subject}"
            else
              echo "FAIL ${short} ${subject}"
              echo "     Expected trailer: ${expected}"
              echo "     Fix with:         git commit --amend --signoff   (or rebase -i to sign each commit)"
              fail=1
            fi
          done
          if [ "${fail}" -ne 0 ]; then
            echo "::error::One or more commits are missing a valid DCO sign-off. See CONTRIBUTING.md."
            exit 1
          fi
          echo "All commits carry a valid Signed-off-by. ✅"
