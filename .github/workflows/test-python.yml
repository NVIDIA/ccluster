name: Python

on:
  pull_request:
    # Only when python/ or one of its generator inputs changes: the CRD types, the
    # catalog Values types and hack/pyschema all feed make python-generate. Docs, chart
    # and controller-only PRs skip it. Keep in sync with AGENTS.md "Commit messages, pull requests, releases and reviews".
    # VERSION is here so a release PR, which changes little else, runs this check too.
    paths:
      - 'VERSION'
      - 'python/**'
      - 'api/**'
      - 'config/crd/**'
      - 'catalogs/**/*.go'
      - 'hack/pyschema/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/test-python.yml'

jobs:
  python:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      # python/ is generated from the CRDs and the catalog Go packages. Regenerate it
      # here and fail if the committed copy differs, so the Go types and the Python
      # models can never drift.
      - name: Verify the committed Python models match the CRDs and catalog
        run: |
          make python-generate
          git diff --exit-code -- python/

      - name: Run the Python tests
        run: make python-test
