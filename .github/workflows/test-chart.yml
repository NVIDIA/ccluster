name: Helm Charts

on:
  pull_request:

jobs:
  charts:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # charts/{cp,ip}/chart are generated from the kustomize overlays. Regenerate
      # them here and fail if the committed copies differ, so config/ and the charts
      # can never drift. The Makefile downloads the pinned kubebuilder into bin/, so
      # this runs the same plugin version a developer does.
      - name: Verify the committed charts match config/
        run: |
          make helm-generate
          git diff --exit-code -- charts/ PROJECT

      - name: Lint the charts
        run: make helm-lint

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Verify catalog metrics contracts
        run: make test-catalogs

      # Render both charts and confirm the resources the rest of the repo depends on
      # by name are present. test/e2e and the AGENTS.md recipes hardcode these.
      - name: Render the charts
        run: |
          helm template ccluster-cp charts/cp/chart -n ccluster-cp-system > /tmp/cp.yaml
          helm template ccluster-ip charts/ip/chart -n ccluster-ip-system > /tmp/ip.yaml
          grep -q 'name: ccluster-cp-controller-manager$' /tmp/cp.yaml
          grep -q 'name: ccluster-cp-controller-manager-metrics-service$' /tmp/cp.yaml
          grep -q 'name: ccluster-ip-controller-manager$' /tmp/ip.yaml
          grep -q 'kind: CustomResourceDefinition' /tmp/cp.yaml

      # The cp chart carries Argo CD as a dependency, vendored as
      # charts/cp/chart/charts/argo-cd-*.tgz, so these render offline with no
      # cluster and no image pulls. They used to live in `make test-e2e-argocd`,
      # which no workflow ran; here they gate every PR.
      #
      # Large CRDs sit OutOfSync forever without server-side diff, which stalls a
      # CCLComponentSet rollout. Without this check a regression looks like a
      # perfectly working deploy.
      - name: Verify the Argo CD dependency renders as expected
        run: |
          grep -q 'controller.diff.server.side: "true"' /tmp/cp.yaml
          # Applications in any namespace: without it Argo CD ignores the Applications
          # the operator writes next to each CCLComponentSet.
          grep -q "application.namespaces: '\*'" /tmp/cp.yaml
          grep -q 'name: argocd-cmd-params-cm$' /tmp/cp.yaml
          grep -q 'applications.argoproj.io' /tmp/cp.yaml
          grep -q 'applicationsets.argoproj.io' /tmp/cp.yaml
          grep -q 'appprojects.argoproj.io' /tmp/cp.yaml
          # The ip chart has no dependencies; Argo CD is control-plane only.
          ! grep -q 'argoproj.io' /tmp/ip.yaml
