# Cut a release from a GitHub Release. Create the release in the GitHub UI (or with
# `gh release create`) against a tag vX.Y.Z; publishing it fires this workflow with the
# tag checked out. Nothing in the tree is bumped: VERSION=${tag#v} is stamped into the
# charts and the Python package, and the images are not rebuilt at all - the :<sha>
# manifests main.yml pushed for the tagged commit are retagged :X.Y.Z, so what ships is
# exactly what was built for that commit. A tag on a commit that never went through main
# has no :<sha> image and fails here, on purpose.
#
# Artifacts:
#   ghcr.io/<owner>/ccluster-{cp,ip}-operator:X.Y.Z   (retag of :<sha>)
#   oci://ghcr.io/<owner>/charts/ccluster-{cp,ip}      (chart version X.Y.Z, appVersion X.Y.Z)
#   PyPI ccluster-py==X.Y.Z                            (trusted publishing, `pypi` environment)
#   the chart tarballs and Python dists attached to the GitHub Release
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Cheap gate. The PR that produced the tagged commit already ran e2e and the drift
  # checks; this only guards against releasing something that never went through a PR.
  check:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches the VERSION file
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: make check-version VERSION="${TAG#v}"
      - run: make test
      - run: make helm-lint
      - run: make python-test

  images:
    name: Retag images
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag :<sha> as :${{ github.event.release.tag_name }}
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: make docker-retag REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" VERSION="${TAG#v}"

  charts:
    name: Publish charts
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Package and push
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: make helm-package helm-push REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" VERSION="${TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: charts
          path: dist/charts/*.tgz
          if-no-files-found: error

  python:
    name: Publish to PyPI
    needs: check
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI trusts this repository + workflow + environment, no token.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Build
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: make python-build VERSION="${TAG#v}"
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python
      - uses: actions/upload-artifact@v4
        with:
          name: python
          path: dist/python/*
          if-no-files-found: error

  assets:
    name: Attach release assets
    needs: [charts, python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" --clobber dist/charts/*.tgz dist/python/*
