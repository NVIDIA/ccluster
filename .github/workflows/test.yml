name: Tests

on:
  pull_request:
    # Only when something the suite depends on changes; docs, catalog and workflow-only
    # PRs skip it. Keep in sync with AGENTS.md "Pull requests".
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'Dockerfile'
      - 'config/**'
      - 'charts/**'
      - 'test/**'
      - '.github/workflows/test.yml'

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # bin/ holds the downloaded tools (controller-gen, kustomize, setup-envtest and its
      # Kubernetes assets, golangci-lint, yq). Building them from source costs a minute
      # or more per job, so they are cached on the Makefile (tool versions) and go.sum
      # (envtest's version derives from controller-runtime's).
      - uses: actions/cache@v4
        with:
          path: bin
          key: bin-${{ runner.os }}-${{ hashFiles('Makefile', 'go.sum') }}

      - name: Running Tests
        run: make test
