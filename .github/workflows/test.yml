name: Tests

on:
  pull_request:
    # Only when something the suite depends on changes; docs and workflow-only PRs skip
    # it. catalogs/** is here because catalog tests read Chart.yaml, values.yaml and
    # chart templates, not only Go. Keep in sync with docs/build-and-release.md "CI checks".
    # VERSION is here so a release PR, which changes little else, runs this check too.
    paths:
      - 'VERSION'
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      # The header of every generated Go file, which the client drift check compares.
      - 'hack/boilerplate.go.txt'
      - 'Dockerfile'
      - 'config/**'
      - 'charts/**'
      - 'catalogs/**'
      - 'test/**'
      # The UI build ccluster server embeds; its tests check it is served.
      - 'internal/server/ui/**'
      - '.github/workflows/test.yml'

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # -diff prints what tidy would change and fails, so the suite and the image builds on
      # main run against the committed go.mod and go.sum.
      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      # Before the manifests check: generate loads every package, and a client generated
      # from API types that have since changed may not compile. Intent-to-add makes files
      # the generators would add count as drift too.
      - name: Check the generated Go client
        run: |
          make client-generate
          git add --intent-to-add pkg/client
          git diff --exit-code -- pkg/client/

      # make test regenerates CRDs, RBAC and deepcopy code before it runs, so a stale
      # committed copy passes the suite and main.yml builds images from it. A stale
      # zz_generated.deepcopy.go still compiles: it copies a new slice, map or pointer
      # field shallowly. The diff covers the whole tree, wherever a generator writes, and
      # intent-to-add makes files the generators would add count as drift too.
      - name: Check the generated manifests and deepcopy code
        run: |
          make manifests generate
          git add --intent-to-add .
          git diff --exit-code

      - name: Running Tests
        run: make test
