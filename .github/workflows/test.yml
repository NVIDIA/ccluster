name: Tests

on:
  pull_request:
    # Only when something the suite depends on changes; docs, catalog and workflow-only
    # PRs skip it. Keep in sync with AGENTS.md "Commit messages, pull requests, releases and reviews".
    # VERSION is here so a release PR, which changes little else, runs this check too.
    paths:
      - 'VERSION'
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      # The header of every generated Go file, which the client drift check compares.
      - 'hack/boilerplate.go.txt'
      - 'Dockerfile'
      - 'config/**'
      - 'charts/**'
      - 'test/**'
      - '.github/workflows/test.yml'

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # -diff prints what tidy would change and fails, so the suite and the image builds on
      # main run against the committed go.mod and go.sum.
      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      # Intent-to-add makes files the generators would add count as drift too.
      - name: Check the generated Go client
        run: |
          make client-generate
          git add --intent-to-add pkg/client
          git diff --exit-code -- pkg/client/

      - name: Running Tests
        run: make test
