name: Tests

on:
  pull_request:
    # Only when something the suite depends on changes; docs, catalog and workflow-only
    # PRs skip it. Keep in sync with AGENTS.md "Commit messages, pull requests, releases and reviews".
    # VERSION is here so a release PR, which changes little else, runs this check too.
    paths:
      - 'VERSION'
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'Dockerfile'
      - 'config/**'
      - 'charts/**'
      - 'test/**'
      - '.github/workflows/test.yml'

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test
