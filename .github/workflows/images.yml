# Publish both operator images, tagged with the commit hash, for every commit on main.
#
# This is the build half of the release rule: images are always :<sha>, and a release
# (release.yml) only retags one of them as :X.Y.Z. It also lets an unreleased main
# commit be deployed by hash: `make deploy-cp IMG_TAG=<sha>`.
name: Images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build and push :<sha>
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The registry prefix follows the repository owner so a fork publishes into its
      # own namespace instead of failing to push to ghcr.io/nvidia.
      - name: Build and push both images
        run: make docker-buildx REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
