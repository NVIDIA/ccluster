name: Lint

on:
  pull_request:

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The Makefile is the single source of the golangci-lint version; `make lint`
      # builds that version from source, which takes over a minute in CI. The action
      # downloads the release binary instead and caches the analysis results between
      # runs. `verify` is `make lint-config`.
      - name: Read the golangci-lint version from the Makefile
        id: version
        run: echo "version=$(sed -n 's/^GOLANGCI_LINT_VERSION ?= //p' Makefile)" >> "$GITHUB_OUTPUT"

      - name: Run linter
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ steps.version.outputs.version }}
          verify: true
