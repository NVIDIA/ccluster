name: Lint

on:
  pull_request:

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # `make lint` builds a custom golangci-lint with the logcheck plugin
      # (.custom-gcl.yml), which the marketplace golangci-lint-action cannot do, and that
      # build costs over a minute. Cache the resulting binary (in bin/) and golangci-lint's
      # own analysis cache instead.
      - uses: actions/cache@v4
        with:
          path: |
            bin
            ~/.cache/golangci-lint
          key: lint-${{ runner.os }}-${{ hashFiles('Makefile', 'go.sum', '.custom-gcl.yml', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: |
            lint-${{ runner.os }}-${{ hashFiles('Makefile', 'go.sum', '.custom-gcl.yml', '.golangci.yml') }}-

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint
