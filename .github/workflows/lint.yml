name: Lint

on:
  pull_request:
    # Only when Go code or the linter's inputs change; docs, chart, catalog-chart and
    # Python-only PRs skip it. Keep in sync with docs/build-and-release.md "CI checks".
    # VERSION is here so a release PR, which changes little else, runs this check too.
    paths:
      - 'VERSION'
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - 'Makefile'
      - '.github/workflows/lint.yml'

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint
