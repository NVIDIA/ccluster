# Publish every merge to main, keyed by commit hash: both operator images and the
# compute-ssh launcher image as :<sha>, and both charts as <next>-dev.<sha> (pointing at
# the :<sha> operator images), all to GHCR. ccluster-py goes to PyPI as <next>.dev<N>, N
# being the commit count, since a PEP 440 version cannot carry the hash.
#
# This is the build half of the release flow. release.yml never builds an image; it
# retags what this workflow pushed. It also lets an unreleased main commit be deployed
# and driven with the matching client:
#   make deploy-cp IMG_TAG=<sha>
#   helm install ccluster-cp oci://ghcr.io/nvidia/charts/ccluster-cp --version <next>-dev.<sha>
#   pip install ccluster-py==<next>.dev<N>
name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish :<sha> images and charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v4
        id: buildx
      # The buildx CLI's type=gha cache needs the Actions cache endpoint and token, which the
      # runner hands only to JavaScript actions. Export them the way
      # crazy-max/ghaction-github-runtime does; that action is not on the org's allow-list.
      - uses: actions/github-script@v9
        with:
          script: |
            for (const v of ["ACTIONS_CACHE_URL", "ACTIONS_RESULTS_URL", "ACTIONS_RUNTIME_TOKEN", "ACTIONS_RUNTIME_URL", "ACTIONS_CACHE_SERVICE_V2"]) {
              if (process.env[v]) core.exportVariable(v, process.env[v]);
            }

      # The layer cache lives in the Actions cache: when nothing under the Dockerfile's
      # inputs changed (only .go, go.mod, go.sum reach it - see .dockerignore) the whole
      # build is a cache hit. The Go module and build caches are BuildKit cache mounts and
      # are deliberately not carried between runs: copying them out through the runner's
      # disk (buildkit-cache-dance plus actions/cache) filled it and failed the job, so a
      # Go change costs a cold compile instead. No QEMU: the build stage runs on
      # BUILDPLATFORM and cross-compiles.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to GHCR for Helm
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      # GHCR namespaces are lowercase while github.repository_owner is "NVIDIA". Passing
      # REGISTRY also makes a fork publish into its own namespace.
      - name: Build and push the images
        run: >
          make docker-buildx REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          BUILDX_ARGS="--cache-from type=gha,scope=images --cache-to type=gha,scope=images,mode=max"
      - name: Package and push both charts
        run: make helm-package helm-push REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"

  python:
    name: Build ccluster-py <next>.dev<N>
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The full history, so N counts every commit; python-build refuses a shallow clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Build
        run: make python-build
      - uses: actions/upload-artifact@v7
        with:
          name: python
          path: dist/python/*
          if-no-files-found: error
      # PyPI's provenance attestation records the commit as well; this puts the pairing
      # on the run page.
      - name: Summarise
        run: |
          {
            echo "Commit \`${GITHUB_SHA}\` built:"
            echo
            for f in dist/python/*; do echo "- \`${f##*/}\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

  pypi:
    name: Publish ccluster-py to PyPI
    needs: python
    runs-on: ubuntu-latest
    # Trusted publishing, as in release.yml: ccluster-py on PyPI has a trusted publisher
    # for each of the two workflows in the `pypi` environment, so no token is needed. The
    # OIDC token is available to every step of the job, so this job runs no build or
    # repository code, only the upload of what the python job built.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python
          path: dist/python
      # skip-existing so re-running the workflow for a commit is a no-op here: N names
      # exactly one commit, so an existing file is this commit's own earlier upload.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python
          skip-existing: true
