# The platform components the embeddings service needs, in the order and namespaces the
# catalog expects: Prometheus's CRDs and server, Istio's traffic rules, the ingress
# controller, KEDA for autoscaling and Argo Rollouts to run the pods.
#
#   helm install platform ./componentset -n team-a -f platform-values.yaml --set infraPlane=edge-1
components:
  - name: kube-prometheus-stack
    chart: catalogs/cluster_base/kube_prometheus_stack
    namespace: prometheus
  - name: istio
    chart: catalogs/cluster_base/istio
    namespace: istio-system
  - name: ingress-nginx
    chart: catalogs/cluster_base/ingress_nginx
    namespace: ingress-nginx
  - name: keda
    chart: catalogs/cluster_base/keda
    namespace: keda
  - name: argo-rollouts
    chart: catalogs/cluster_base/argo_rollouts
    namespace: argo-rollouts
