# Gives the control plane access to an infra-plane cluster: a ServiceAccount bound to
# cluster-admin and a long-lived token for it. Apply it to the infra-plane cluster, not
# the control plane. These are the objects `ccluster register` creates, under the same
# names, so the two can be mixed.
#
# Argo CD installs CRDs, namespaces and other cluster-scoped objects on the cluster, so it
# needs the same rights `argocd cluster add` grants. Whoever can read the token is
# cluster-admin on this cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ccluster-manager
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ccluster-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: ccluster-manager
    namespace: kube-system
---
# The token controller fills in this Secret's token and ca.crt.
apiVersion: v1
kind: Secret
metadata:
  name: ccluster-manager-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: ccluster-manager
type: kubernetes.io/service-account-token
