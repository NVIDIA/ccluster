# Rendered without data so the release owns the Secret and `helm uninstall` removes it.
# The Job below adds the "token" key; upgrades keep it because no manifest mentions it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argocd-token.labels" . | nindent 4 }}
type: Opaque
