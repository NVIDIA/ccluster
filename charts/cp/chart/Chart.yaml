# Chart metadata for ccluster-cp, the control-plane chart. The operator is one of its
# components; the chart is the whole plane.
#
# Everything under templates/ is REGENERATED from `kustomize build config/cp` by
# `make helm-generate`. This file and values.yaml are not — the helm/v2-alpha
# plugin preserves both — so they are the only place to hand-edit, and the only
# place the Argo CD dependency below can safely live.
apiVersion: v2
name: ccluster-cp
description: ccluster control plane - the cp operator and its cluster dependencies
type: application

# Placeholders. The release version is the git tag, and `make helm-package` stamps it
# into both fields (`helm package --version --app-version`) on a copy under dist/.
version: 0.0.0-dev
appVersion: "0.0.0-dev"

keywords:
  - kubernetes
  - operator

home: https://github.com/NVIDIA/ccluster
sources:
  - https://github.com/NVIDIA/ccluster/tree/main/charts/cp/chart
maintainers:
  - name: CCluster maintainers
    url: https://github.com/NVIDIA/ccluster/blob/main/MAINTAINERS.md

# Argo CD is a prerequisite of the control-plane cluster, installed alongside the
# operator rather than by it: bootstrapping Argo CD needs the rights to create its
# CRDs and ClusterRoles, which the operator would then hold forever, and an operator
# that owns Argo CD cannot be used to repair a broken Argo CD. The operator only ever
# creates Application resources.
#
# Only the cp chart carries this. Argo CD is hub-and-spoke: one instance in the
# control-plane cluster, with infra-plane clusters registered as remote destinations.
dependencies:
  - name: argo-cd
    version: 10.4.0
    repository: https://argoproj.github.io/argo-helm
    condition: argo-cd.enabled
  # Creates the operator's Argo CD API token, but only for the Argo CD installed above:
  # its argocd-initial-admin-secret is the one admin credential the chart can count on.
  # With an existing Argo CD, the user creates the token (see docs/development.md).
  - name: argocd-token
    version: 0.0.0-dev
    repository: file://../argocd-token
    condition: argo-cd.enabled
  # Publishes each CCLInfraPlane's wildcard records from the DNSEndpoint the operator writes,
  # into the DNS zone the user created for the domain. Like Argo CD, it is installed
  # alongside the operator rather than by it, and the operator only ever writes
  # DNSEndpoints. Off by default: it needs a DNS provider and its credentials.
  # docs/installation.md#dns names this version and links external-dns's docs at it.
  - name: external-dns
    version: 1.19.0
    repository: https://kubernetes-sigs.github.io/external-dns/
    condition: external-dns.enabled

annotations:
  kubebuilder.io/generated-by: kubebuilder
