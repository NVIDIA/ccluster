{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.20.1
  name: cclinfraplanes.ccluster.nvidia.com
spec:
  group: ccluster.nvidia.com
  names:
    kind: CCLInfraPlane
    listKind: CCLInfraPlaneList
    plural: cclinfraplanes
    singular: cclinfraplane
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.domain
      name: Domain
      type: string
    - jsonPath: .status.conditions[?(@.type=="Available")].status
      name: Available
      type: string
    - jsonPath: .status.conditions[?(@.type=="ClusterConfigApplied")].status
      name: ClusterConfig
      type: string
    - jsonPath: .status.clusterConfig.conditions[?(@.type=="Verified")].status
      name: Verified
      type: string
    - jsonPath: .status.clusterConfig.conditions[?(@.type=="LoadBalancerReady")].status
      name: LoadBalancer
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CCLInfraPlane is the Schema for the cclinfraplanes API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of CCLInfraPlane
            properties:
              clusterCredentialsRef:
                description: |-
                  clusterCredentialsRef references a Secret in the same namespace as this
                  CCLInfraPlane that holds the credentials for the infra-plane cluster's API
                  server.

                  Its data is copied verbatim into a Secret in the Argo CD namespace, named
                  after this CCLInfraPlane and labelled "argocd.argoproj.io/secret-type:
                  cluster". The operator does not interpret the data, so the referenced Secret
                  must already carry Argo CD's cluster-secret keys - "server" and "config".

                  The exception is "name", which Argo CD displays as the cluster name: the
                  operator always sets it to this CCLInfraPlane's name, overwriting whatever the
                  referenced Secret holds. See
                  https://argo-cd.readthedocs.io/en/stable/operator-manual/declarative-setup/#clusters
                properties:
                  name:
                    description: name is the name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                title: LocalObjectReference
                type: object
              domain:
                description: |-
                  domain is the infra-plane cluster's DNS domain. The control-plane operator writes it
                  to the CCLClusterConfig singleton on that cluster, which the infra-plane operator
                  verifies the cluster against. It must be a lowercase DNS name of at least two labels,
                  each at most 63 characters, and it cannot be changed once set.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)+$
                type: string
                x-kubernetes-validations:
                - message: domain is immutable
                  rule: self == oldSelf
            required:
            - clusterCredentialsRef
            - domain
            title: CCLInfraPlaneSpec
            type: object
          status:
            description: status defines the observed state of CCLInfraPlane
            properties:
              clusterConfig:
                description: |-
                  clusterConfig is the status of the CCLClusterConfig singleton on the infra-plane
                  cluster, copied verbatim whenever it changes there. It is what the infra-plane
                  operator reports about the cluster; ClusterConfigApplied says whether the copy is
                  current. Its conditions and observedGeneration are the infra-plane operator's, and
                  refer to the CCLClusterConfig, not to this CCLInfraPlane.
                properties:
                  conditions:
                    description: |-
                      conditions represent the current state of the infra-plane cluster's
                      CCLClusterConfig.

                      Condition types reported by the infra-plane operator:
                        - "Verified": every catalogs/cluster_base component is installed in this
                          cluster and configured for it. When False, the message names the charts
                          that failed verification.
                        - "LoadBalancerReady": the cluster's ingress LoadBalancer, the Service of type
                          LoadBalancer labelled ccluster.nvidia.com/track-ingress=true, has an address.
                          Reasons are Ready, Pending (no address yet), NotDeployed (no such Service) and
                          Ambiguous (more than one). When Ready, the message lists the Service and its
                          addresses, IPs and hostnames in the order the Service reports them.

                      The status of each condition is one of True, False, or Unknown.
                    items:
                      description: Condition contains details for one aspect of the
                        current state of this API Resource.
                      properties:
                        lastTransitionTime:
                          description: |-
                            lastTransitionTime is the last time the condition transitioned from one status to another.
                            This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                          format: date-time
                          type: string
                        message:
                          description: |-
                            message is a human readable message indicating details about the transition.
                            This may be an empty string.
                          maxLength: 32768
                          type: string
                        observedGeneration:
                          description: |-
                            observedGeneration represents the .metadata.generation that the condition was set based upon.
                            For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                            with respect to the current state of the instance.
                          format: int64
                          minimum: 0
                          type: integer
                        reason:
                          description: |-
                            reason contains a programmatic identifier indicating the reason for the condition's last transition.
                            Producers of specific condition types may define expected values and meanings for this field,
                            and whether the values are considered a guaranteed API.
                            The value should be a CamelCase string.
                            This field may not be empty.
                          maxLength: 1024
                          minLength: 1
                          pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                          type: string
                        status:
                          description: status of the condition, one of True, False,
                            Unknown.
                          enum:
                          - "True"
                          - "False"
                          - Unknown
                          type: string
                        type:
                          description: type of condition in CamelCase or in foo.example.com/CamelCase.
                          maxLength: 316
                          pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                          type: string
                      required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - type
                    x-kubernetes-list-type: map
                  observedGeneration:
                    description: |-
                      observedGeneration is the CCLClusterConfig's .metadata.generation the conditions
                      were computed from.
                    format: int64
                    type: integer
                title: CCLClusterConfigStatus
                type: object
              conditions:
                description: |-
                  conditions represent the current state of the CCLInfraPlane resource.

                  Condition types reported by the control-plane operator:
                    - "Available": the namespace's Argo CD AppProject exists and the cluster
                      Secret has been mirrored into the Argo CD namespace.
                    - "ClusterConfigApplied": the CCLClusterConfig singleton on the infra-plane
                      cluster carries this CCLInfraPlane's domain.

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the .metadata.generation the conditions
                  were computed from.
                format: int64
                type: integer
            title: CCLInfraPlaneStatus
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
