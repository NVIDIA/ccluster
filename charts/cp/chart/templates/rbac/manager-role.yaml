apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ccluster.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - argoproj.io
  resources:
  - applications
  - appprojects
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ccluster.nvidia.com
  resources:
  - cclcomponentsets
  - cclinfraplanes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ccluster.nvidia.com
  resources:
  - cclcomponentsets/finalizers
  - cclinfraplanes/finalizers
  verbs:
  - update
- apiGroups:
  - ccluster.nvidia.com
  resources:
  - cclcomponentsets/status
  - cclinfraplanes/status
  verbs:
  - get
  - patch
  - update
