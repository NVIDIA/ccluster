{{- if .Values.rbacHelpers.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: ccluster
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "ccluster.resourceName" (dict "suffix" "ccldeployment-viewer-role" "context" $) }}
rules:
- apiGroups:
  - ccluster.nvidia.com
  resources:
  - ccldeployments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ccluster.nvidia.com
  resources:
  - ccldeployments/status
  verbs:
  - get
{{- end }}
