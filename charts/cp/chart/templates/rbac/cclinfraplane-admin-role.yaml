{{- if .Values.rbac.helpers.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: ccluster
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "ccluster.resourceName" (dict "suffix" "cclinfraplane-admin-role" "context" $) }}
rules:
- apiGroups:
  - ccluster.nvidia.com
  resources:
  - cclinfraplanes
  verbs:
  - '*'
- apiGroups:
  - ccluster.nvidia.com
  resources:
  - cclinfraplanes/status
  verbs:
  - get
{{- end }}
