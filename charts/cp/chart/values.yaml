## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
## Pinned so every resource is named `ccluster-cp-*` regardless of the release name.
## Without it the names derive from the release name, and `test/e2e/e2e_test.go`,
## the `kubectl -n ccluster-cp-system scale deploy/...` recipe in AGENTS.md, and the
## `ccluster-cp-` namePrefix the kustomize overlay used all depend on these exact names.
fullnameOverride: "ccluster-cp"

## Configure the controller manager deployment
##
manager:
  replicas: 1

  image:
    repository: ccluster-cp-operator
    tag: dev
    pullPolicy: IfNotPresent

  ## Arguments
  ##
  ## --argocd-namespace is where the operator writes the Argo CD cluster Secret it
  ## clones from each CCLInfraPlane's clusterCredentialsRef, and the AppProject it
  ## creates for each namespace holding CCLInfraPlanes. (The Applications built from a
  ## CCLDeployment go into the CCLDeployment's own namespace — see
  ## `application.namespaces` below.) The default matches a stock Argo CD install. Note
  ## that the `argo-cd` subchart below installs into this chart's RELEASE namespace,
  ## not `argocd` — so when Argo CD comes from this chart, override this to the release
  ## namespace. `make deploy-cp` does that for you.
  ##
  ## --catalog-repo-url and --catalog-revision are the Git repository and revision a
  ## CCLDeployment's components are resolved against; each component's `chart` is a
  ## path within that repository. Argo CD's repo-server clones it, so the revision has
  ## to be pushed — point --catalog-revision at a branch to try a catalog change before
  ## it merges.
  args:
    - --leader-elect
    - --argocd-namespace=argocd
    - --catalog-repo-url=https://github.com/NVIDIA/ccluster
    - --catalog-revision=main

  ## Environment variables
  ##
  env: []

  ## Env overrides (--set manager.envOverrides.VAR=value)
  ## Same name in env above: this value takes precedence.
  ##
  envOverrides: {}

  ## Image pull secrets
  ##
  imagePullSecrets: []

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

## Helper RBAC roles for managing custom resources
##
rbacHelpers:
  # Install convenience admin/editor/viewer roles for CRDs.
  # Enabled to match what the kustomize overlay installed; the operators do not
  # use these roles themselves, they exist to help cluster admins hand out access.
  enable: true

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enable: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint with RBAC protection.
##
metrics:
  enable: true
  # Metrics server port
  port: 8443

## Cert-manager integration for TLS certificates.
## Required for webhook certificates and metrics endpoint certificates.
##
certManager:
  enable: false

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enable: false

## Argo CD — a dependency of this chart, not something the operator installs.
## See the rationale in Chart.yaml. Values here are passed to the upstream
## argo-cd chart; anything not set below uses that chart's defaults.
##
## Set `enabled: false` to install the operator into a cluster that already runs
## Argo CD, or for hermetic tests that must not pull the Argo CD images
## (`make deploy-cp ARGOCD=false`).
argo-cd:
  enable: true

  configs:
    params:
      ## Server-side diff, the companion to the ServerSideApply sync option every
      ## generated Application carries.
      ##
      ## ServerSideApply changes how Argo CD *writes* a resource; this changes how it
      ## *compares* one. Without it the comparison is still a client-side three-way
      ## merge against the kubectl.kubernetes.io/last-applied-configuration annotation
      ## — which an object larger than the annotation limit cannot carry, and which
      ## server-side apply stops maintaining. Large CRDs then report OutOfSync forever
      ## despite syncing cleanly, and because the operator releases the next component
      ## only on Healthy *and* Synced, one such CRD stalls every later component of a
      ## CCLDeployment.
      ##
      ## argo-rollouts' rollouts.argoproj.io CRD is ~600KB; several other cluster_base
      ## charts are comparable.
      controller.diff.server.side: "true"

      ## "Applications in any namespace". The operator writes each CCLDeployment's
      ## Applications into the CCLDeployment's own namespace, under an AppProject named
      ## after that namespace, so that one namespace's Applications and clusters are
      ## isolated from another's. Argo CD only looks for Applications in the namespaces
      ## listed here, and the list is static — changing it restarts argocd-server and
      ## the application controller — so a glob is the only way to cover namespaces
      ## that do not exist yet. What an Application in a given namespace may do is
      ## still bounded by its AppProject's sourceNamespaces, which the operator sets to
      ## exactly that namespace.
      ##
      ## Setting this also makes the argo-cd chart widen argocd-server's ClusterRole to
      ## manage Applications cluster-wide; the application controller's ClusterRole
      ## already covers every namespace.
      application.namespaces: "*"

