## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
## Pinned so every resource is named `ccluster-cp-*` regardless of the release name.
## Without it the names derive from the release name, and `test/e2e/e2e_test.go`,
## the `kubectl -n ccluster-cp-system scale deploy/...` recipe in AGENTS.md, and the
## `ccluster-cp-` namePrefix the kustomize overlay used all depend on these exact names.
fullnameOverride: "ccluster-cp"

## Configure the controller manager deployment
##
manager:
  ## Set to false to skip manager installation
  ##
  enabled: true

  replicas: 1

  ## repository is the published image. tag is deliberately empty in the committed chart:
  ## `make helm-package` stamps it with the release version (which is also the chart
  ## version and appVersion) and `make deploy-*` sets both from IMG_CP / IMG_IP, whose
  ## default tag is the current commit hash. Nothing installs from this file unstamped;
  ## an empty tag falls back to Chart.appVersion.
  image:
    repository: ghcr.io/nvidia/ccluster-cp-operator
    tag: ""
    pullPolicy: IfNotPresent

  ## Configuration
  ##
  ## Every setting of the operator's own is an environment variable named after its
  ## flag: --catalog-revision reads CCLUSTER_CATALOG_REVISION. Set them in envOverrides,
  ## a map of variable name to value, so one --set changes one setting and keeps the
  ## others:
  ##   --set manager.envOverrides.CCLUSTER_BASE_DOMAIN=planes.example.com
  ## A flag added to args takes precedence over its variable. `ccluster-cp-operator
  ## --help` lists every flag and its variable.
  ##
  ## CCLUSTER_BASE_DOMAIN is required, and has no default: the operator does not start
  ## without it. Every CCLInfraPlane's domain is derived under it as
  ## "<name>.<namespace>.<base domain>", which the operator writes to the plane's
  ## CCLClusterConfig and publishes the plane's records under. Set it once: changing it
  ## moves every plane's domain and records. Two control planes must not share one, or
  ## same-named planes in same-named namespaces claim the same records.
  ##
  ## CCLUSTER_CATALOG_REPO_URL and CCLUSTER_CATALOG_REVISION are the Git repository and
  ## revision a CCLComponentSet's components are resolved against; each component's
  ## `chart` is a path within that repository. Argo CD's repo-server clones it, so the
  ## revision has to be pushed: point it at a branch to try a catalog change before it
  ## merges. A released chart pins the revision to the release's vX.Y.Z tag, so an upgrade
  ## brings the matching catalog, unless --reuse-values keeps the previous release's.
  ##
  ## CCLUSTER_ARGOCD_NAMESPACE is where the operator writes the Argo CD cluster Secret it
  ## clones from each CCLInfraPlane's clusterCredentialsRef, and the AppProject it
  ## creates for each namespace holding CCLInfraPlanes. (The Applications built from a
  ## CCLComponentSet go into the CCLComponentSet's own namespace — see
  ## `application.namespaces` below.) Unset, it is the operator's own namespace, the
  ## release namespace, which is where the `argo-cd` subchart below installs Argo CD.
  ## Set it only for an existing Argo CD in another namespace, such as `argocd`.
  ##
  ## The operator reads components' resource trees, and a few live objects, through
  ## argocd-server's API to judge their health for status.componentHealthStatuses and
  ## before releasing the next component, as the Argo CD account declared under
  ## `argo-cd.configs` below. Argo CD must run in this cluster:
  ## - CCLUSTER_ARGOCD_SERVER_SERVICE (operator default argocd-server, a stock
  ##   install's) is argocd-server's Service in the Argo CD namespace. The default below
  ##   is the `argo-cd` subchart's, fixed by its fullnameOverride; set it to the Service
  ##   of an existing Argo CD instead. The operator connects over HTTPS without verifying
  ##   the server's certificate.
  ## - CCLUSTER_ARGOCD_TOKEN_SECRET (default ccluster-cp-argocd-token) is the Secret in
  ##   the Argo CD namespace whose `token` key holds that account's token.
  ##
  ## The operator writes and watches each infra-plane cluster's CCLClusterConfig with the
  ## cluster's registered credentials. CCLUSTER_INFRAPLANE_RESYNC_PERIOD (default 5m) is
  ## a safety net behind the watch: how often a written one is reconciled anyway; 0
  ## disables it.
  ##
  ## The operator also writes a DNSEndpoint per CCLInfraPlane, pointing "*.<lb>.<domain>"
  ## at each of the plane's LoadBalancers labelled ccluster.nvidia.com/loadbalancer: <lb>,
  ## such as "*.nginx.<domain>" at its ingress, <domain> being the plane's derived one.
  ## Nothing is published unless the `external-dns` dependency below is enabled.
  ## CCLUSTER_DNS_ENDPOINT_NAMESPACE (default: the operator's own namespace, where that
  ## external-dns runs) is where the DNSEndpoints go; set it only for an external-dns
  ## installed elsewhere. The operator watches DNSEndpoints only if their CRD exists when
  ## it starts. Enabling external-dns on an installed release neither installs that CRD,
  ## which Helm does only with the release, nor restarts the operator: apply the CRD first
  ## and restart the operator afterwards. Until then a plane's DNSReady moves on only with
  ## the resync, and never with CCLUSTER_INFRAPLANE_RESYNC_PERIOD=0.
  ##
  ## CCLUSTER_COMPONENTSET_MAX_CONCURRENT_RECONCILES (default 4) is how many
  ## CCLComponentSets the operator reconciles at once, for the rollout and for component
  ## health each. Raise it when the cclcomponentset or componenthealth controller's
  ## workqueue_depth and workqueue_queue_duration_seconds metrics stay high and
  ## controller_runtime_active_workers sits at the worker count.
  ## CCLInfraPlanes are always reconciled one at a time.
  envOverrides:
    CCLUSTER_CATALOG_REPO_URL: https://github.com/NVIDIA/ccluster
    CCLUSTER_CATALOG_REVISION: main
    CCLUSTER_ARGOCD_SERVER_SERVICE: ccluster-cp-argocd-server

  ## Full EnvVar entries, rendered before envOverrides, for variables that need more
  ## than a value, such as one read from a Secret.
  env: []

  ## Arguments. Only the operator-agnostic flags, which have no variable. Setting args
  ## replaces this whole list.
  args:
    - --leader-elect

  ## Image pull secrets, rendered as the pod's imagePullSecrets when non-empty.
  ## The released ghcr.io/nvidia images are public and need none; set one to pull
  ## from a private registry, such as a fork's:
  ##
  ## imagePullSecrets:
  ##   - name: ghcr-credentials
  imagePullSecrets: []

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

  ## Deployment strategy
  ##
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  ## Priority class name
  ##
  # priorityClassName: ""

  ## Topology spread constraints
  ##
  # topologySpreadConstraints: []

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

## RBAC configuration
##
rbac:
  ## RBAC resource scope
  ## - false (default): ClusterRole/ClusterRoleBinding (all namespaces)
  ## - true: Role/RoleBinding (release namespace only)
  ##
  ## The operator watches CCLInfraPlanes and CCLComponentSets in every namespace and
  ## writes into the Argo CD namespace, so it needs the cluster-scoped default.
  namespaced: false

  ## Helper roles for CRD management (admin/editor/viewer)
  ##
  helpers:
    ## Install convenience admin/editor/viewer roles for CRDs.
    ## Enabled to match what the kustomize overlay installed; the operators do not
    ## use these roles themselves, they exist to help cluster admins hand out access.
    enabled: true

## ServiceAccount configuration
##
serviceAccount:
  # Install default ServiceAccount provided
  enabled: true

  ## Existing ServiceAccount name (only when enabled=false)
  ## Note: When enabled=true, respects nameOverride/fullnameOverride
  ##
  # name: ""

  ## Custom ServiceAccount annotations
  ##
  # annotations: {}

  ## Custom ServiceAccount labels
  ##
  # labels: {}

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enabled: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint
##
metrics:
  enabled: true
  # Metrics server port
  port: 8443
  # Enable secure metrics: HTTPS with certs/auth (true) or HTTP (false).
  # Note: Metrics authn/authz needs ClusterRole access.
  secure: true

## Cert-manager integration for TLS certificates.
## Required for webhook certificates and metrics endpoint certificates.
##
certManager:
  enabled: false

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enabled: false

## Network policies for controlling traffic flow.
## Enable to restrict ingress to the controller manager.
##
networkPolicy:
  enabled: false

## Argo CD — a dependency of this chart, not something the operator installs.
## See the rationale in Chart.yaml. Values here are passed to the upstream
## argo-cd chart; anything not set below uses that chart's defaults.
##
## Set `enabled: false` to install the operator into a cluster that already runs
## Argo CD, or for hermetic tests that must not pull the Argo CD images
## (`make deploy-cp ARGOCD=false`). That also disables the argocd-token dependency:
## an existing Argo CD needs the account and policy below declared in its own config,
## and a token for it stored in Secret ccluster-cp-argocd-token in --argocd-namespace
## (see docs/development.md).
argo-cd:
  enabled: true

  ## Pinned so Argo CD's resources are named `ccluster-cp-argocd-*` whatever the release
  ## name, which lets the operator's --argocd-server-service above and the argocd-token
  ## dependency name argocd-server's Service, ccluster-cp-argocd-server, as a constant.
  ## Changing this or server.name renames that Service: set --argocd-server-service and
  ## `argocd-token.server` to the new name as well.
  fullnameOverride: ccluster-cp-argocd

  configs:
    params:
      ## Server-side diff, the companion to the ServerSideApply sync option every
      ## generated Application carries.
      ##
      ## ServerSideApply changes how Argo CD *writes* a resource; this changes how it
      ## *compares* one. Without it the comparison is still a client-side three-way
      ## merge against the kubectl.kubernetes.io/last-applied-configuration annotation
      ## — which an object larger than the annotation limit cannot carry, and which
      ## server-side apply stops maintaining. Large CRDs then report OutOfSync forever
      ## despite syncing cleanly, and because the operator releases the next component
      ## only on Healthy *and* Synced, one such CRD stalls every later component of a
      ## CCLComponentSet.
      ##
      ## argo-rollouts' rollouts.argoproj.io CRD is ~600KB; several other cluster_base
      ## charts are comparable.
      controller.diff.server.side: "true"

      ## "Applications in any namespace". The operator writes each CCLComponentSet's
      ## Applications into the CCLComponentSet's own namespace, under an AppProject named
      ## after that namespace, so that one namespace's Applications and clusters are
      ## isolated from another's. Argo CD only looks for Applications in the namespaces
      ## listed here, and the list is static — changing it restarts argocd-server and
      ## the application controller — so a glob is the only way to cover namespaces
      ## that do not exist yet. What an Application in a given namespace may do is
      ## still bounded by its AppProject's sourceNamespaces, which the operator sets to
      ## exactly that namespace.
      ##
      ## Setting this also makes the argo-cd chart widen argocd-server's ClusterRole to
      ## manage Applications cluster-wide; the application controller's ClusterRole
      ## already covers every namespace.
      application.namespaces: "*"

    ## The Argo CD account the operator reads argocd-server's API as: an Application's
    ## resource tree, and the live manifests and events of the objects in it, none of
    ## which is in the Application object. `apiKey` lets it hold API tokens; without
    ## `login` it has no password and cannot use the UI.
    ##
    ## The argocd-token dependency creates its token after install and stores it in
    ## Secret ccluster-cp-argocd-token, which the operator reads.
    cm:
      accounts.ccluster-cp: apiKey

    ## Read-only access for that account. `applications, get` covers the tree, resource
    ## and events reads; `*/*` matches every Application in any project and, since the
    ## glob spans `/`, in any namespace. Nothing grants it create, update, sync or delete:
    ## the operator writes Applications through the Kubernetes API, not argocd-server.
    ##
    ## A user policy must be merged in here rather than set alone, which would drop this
    ## line.
    rbac:
      policy.csv: |
        p, ccluster-cp, applications, get, */*, allow

## external-dns — a dependency of this chart, off by default. See the rationale in
## Chart.yaml. Values here are passed to the upstream external-dns chart.
##
## It publishes the DNSEndpoint the operator writes for each CCLInfraPlane - "*.<lb>.<domain>"
## pointing at each of the plane's labelled LoadBalancers - into the most specific DNS zone
## it manages that the domain falls under. Every plane's domain is under --base-domain, so
## one zone for the base domain covers them all. Creating it, and delegating it, is the
## user's. A record that falls under none of its zones is dropped without an error
## (https://github.com/NVIDIA/ccluster/issues/174).
##
## The presets below confine it to those DNSEndpoints, so it does not touch anything else,
## another external-dns in the cluster included:
##   - `namespaced` has it read DNSEndpoints from the release namespace only, the
##     operator's default --dns-endpoint-namespace, under a Role rather than a
##     ClusterRole;
##   - `sources` is the DNSEndpoint CRD alone, so no Service or Ingress is published;
##   - `txtOwnerId` limits deletions to the records it created itself.
## The DNSEndpoint CRD comes with this chart and is shared with any other external-dns:
## Helm installs it only with the release, and only if it is missing, and never upgrades
## or deletes it.
##
## The provider, the zones it may write and its credentials are the user's to set, for
## instance for Route53 with IRSA:
##   provider:
##     name: aws
##   domainFilters:
##     - planes.example.com
##   serviceAccount:
##     annotations:
##       eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/<role>
## docs/development.md has the matching IAM policy.
external-dns:
  enabled: false

  sources:
    - crd
  namespaced: true
  policy: sync
  registry: txt
  txtOwnerId: ccluster-cp
  interval: 1m

  extraArgs:
    ## A TXT ownership record is named after the record it owns plus its type, which for
    ## a wildcard is "a-*.nginx.<domain>": a "*" that is not a whole label is not a
    ## wildcard, and most DNS providers reject it. This names it
    ## "a-wildcard.nginx.<domain>" instead.
    txt-wildcard-replacement: wildcard
