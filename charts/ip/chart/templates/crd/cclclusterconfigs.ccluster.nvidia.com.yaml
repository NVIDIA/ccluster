{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.20.1
  name: cclclusterconfigs.ccluster.nvidia.com
spec:
  group: ccluster.nvidia.com
  names:
    kind: CCLClusterConfig
    listKind: CCLClusterConfigList
    plural: cclclusterconfigs
    singular: cclclusterconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Verified")].status
      name: Verified
      type: string
    - jsonPath: .spec.domain
      name: Domain
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CCLClusterConfig is the Schema for the cclclusterconfigs API.

          It describes the cluster the infra-plane operator runs in, and it is that operator's
          only input: the operator verifies every catalogs/cluster_base component against it and
          reports the outcome in status. It is cluster-scoped and there is exactly one, named
          "cluster".
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of CCLClusterConfig
            properties:
              domain:
                description: |-
                  domain is the cluster's DNS domain, and its SPIFFE trust domain. Components such
                  as spire, external-dns and final_stack must be configured with it; the infra-plane
                  operator verifies that they are. It must be a lowercase DNS name of at least two
                  labels, each at most 63 characters.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)+$
                type: string
            required:
            - domain
            title: CCLClusterConfigSpec
            type: object
          status:
            description: status defines the observed state of CCLClusterConfig
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the infra-plane cluster's
                  CCLClusterConfig.

                  Condition types reported by the infra-plane operator:
                    - "Verified": every catalogs/cluster_base component is installed in this
                      cluster and configured for it. When False, the message names the charts
                      that failed verification.

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              loadBalancers:
                description: |-
                  loadBalancers are the cluster's LoadBalancer Services labelled
                  ccluster.nvidia.com/loadbalancer, one per label value, as the infra-plane operator
                  last observed them, at most 256. A value carried by more than one Service is left
                  out and reported in the Verified condition.
                items:
                  description: |-
                    LoadBalancerStatus is the address of a LoadBalancer Service labelled
                    ccluster.nvidia.com/loadbalancer. ip and hostname are both empty until the cloud
                    provider assigns one.
                  properties:
                    hostname:
                      description: |-
                        hostname is the LoadBalancer's DNS name, set by cloud providers whose load
                        balancers are addressed by name rather than by IP: the first hostname the Service
                        reports. It must be a lowercase DNS name, without a trailing dot, that is not an IP
                        address.
                      maxLength: 253
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                      x-kubernetes-validations:
                      - message: hostname must not be an IP address
                        rule: '!isIP(self)'
                    ip:
                      description: |-
                        ip is the LoadBalancer's IP address: the first IP the Service reports. It must be an
                        IPv4 or IPv6 address in canonical form, without a zone; an IPv4-mapped IPv6 address
                        is written as IPv4.
                      maxLength: 45
                      type: string
                      x-kubernetes-validations:
                      - message: ip must be an IPv4 or IPv6 address in canonical form,
                          without a zone
                        rule: isIP(self) && ip.isCanonical(self)
                    name:
                      description: name is the Service's ccluster.nvidia.com/loadbalancer
                        label value.
                      maxLength: 63
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 256
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  observedGeneration is the CCLClusterConfig's .metadata.generation the conditions
                  were computed from.
                format: int64
                type: integer
            title: CCLClusterConfigStatus
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: CCLClusterConfig is a singleton and must be named "cluster"
          rule: self.metadata.name == 'cluster'
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
