# Chart metadata for ccluster-ip, the infra-plane chart. The operator is one of its
# components; the chart is the whole plane.
#
# Everything under templates/ is REGENERATED from `kustomize build config/ip` by
# `make helm-generate`. This file and values.yaml are not — the helm/v2-alpha
# plugin preserves both.
#
# No dependencies: Argo CD is hub-and-spoke and lives in the control-plane cluster
# only. Infra-plane clusters are registered there as remote destinations.
apiVersion: v2
name: ccluster-ip
description: ccluster infra plane - the ip operator
type: application

# Placeholders. The release version is the git tag, and `make helm-package` stamps it
# into both fields (`helm package --version --app-version`) on a copy under dist/.
version: 0.0.1
appVersion: "0.0.1"

keywords:
  - kubernetes
  - operator

annotations:
  kubebuilder.io/generated-by: kubebuilder
