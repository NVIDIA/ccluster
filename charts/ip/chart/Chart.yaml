# Chart metadata for ccluster-ip, the infra-plane chart. The operator is one of its
# components; the chart is the whole plane.
#
# Everything under templates/ is REGENERATED from `kustomize build config/ip` by
# `make helm-generate`. This file and values.yaml are not — the helm/v2-alpha
# plugin preserves both.
#
# No dependencies: Argo CD is hub-and-spoke and lives in the control-plane cluster
# only. Infra-plane clusters are registered there as remote destinations. The chart
# carries one CRD, CCLClusterConfig, the singleton the operator verifies the cluster
# against.
apiVersion: v2
name: ccluster-ip
description: ccluster infra plane - the ip operator and the CCLClusterConfig CRD it verifies the cluster against
type: application

# Placeholders. The release version is the git tag, and `make helm-package` stamps it
# into both fields (`helm package --version --app-version`) on a copy under dist/.
version: 0.0.0-dev
appVersion: "0.0.0-dev"

keywords:
  - kubernetes
  - operator

home: https://github.com/NVIDIA/ccluster
sources:
  - https://github.com/NVIDIA/ccluster/tree/main/charts/ip/chart
maintainers:
  - name: CCluster maintainers
    url: https://github.com/NVIDIA/ccluster/blob/main/MAINTAINERS.md

annotations:
  kubebuilder.io/generated-by: kubebuilder
